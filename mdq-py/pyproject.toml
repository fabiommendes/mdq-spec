[project]
name = "mdq"
version = "0.1.0"
description = "Reference schemas and validation CLI for the MDQ question file format."
readme = "README.md"
authors = [{ name = "Fábio Macêdo Mendes" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=15.0.0",
    "markdown-it-py>=4.2.0",
    "pydantic>=2.11",
    "optionz>=0.2.0",
    "linkify-it-py>=2.2.0",
    "python-slugify>=8.0.4",
    "pygments>=2.21.0",
    "unicodedata2>=17,<18",
]

[project.optional-dependencies]
test = ["pytest>=7"]
hypothesis = ["hypothesis>=6.167.1"]

[project.scripts]
mdq = "mdq.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mdq"
module-root = "."

[dependency-groups]
dev = [
    "jsonschema>=4.18",
    "referencing>=0.28",
    "lark-parser>=0.12.0",
    "hypothesis>=6.167.1",
    "lark-run>=0.1.1",
    "mypy>=2.3.1",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "pytest-coverage>=0.0",
    "taskipy>=1.14.1",
    "doc-zero>=0.2.1",
    "types-pyyaml>=6.0.12.20260906",
    "types-pygments>=2.21.0.20260819",
]

[tool.taskipy.tasks]
typecheck = "mypy mdq"
test = "pytest tests"
cov = "pytest --cov=mdq --cov-report=term-missing"
doc = "uv run doc0 build"
doc-watch = "uv run doc0 watch"


[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["unicodedata2"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jsonschema.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["yaml.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["pygments.*"]
follow_untyped_imports = true

[tool.ruff.lint]
ignore = [
    "F402", # Ignore redefinition of unused name from import
]

[tool.pytest.ini_options]
pythonpath = ["tests", "scripts"]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
