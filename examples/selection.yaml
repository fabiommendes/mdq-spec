# Vectors for the seeded selection of an `includeAll` block (docs/exam.md,
# "Seeded selection").
#
# Document structure
#
# Case {
#   name: string
#
#   // The host seed. A string without U+0000.
#   seed: string
#
#   // The ids of the candidates, in the order the exam shows them.
#   candidates: string[]
#
#   // The `max` of the block. When absent, the block has no `max`.
#   max?: integer
#
#   // The ids that stay, in the order of `candidates`.
#   selected: string[]
#
#   // The digest of each candidate, to check an implementation step by
#   // step: sha256(seed + "\0" + id) in UTF-8, as 64 lowercase hex digits.
#   digests: {[id: string]: string}
# }
#
# The case "a new candidate removes at most one question" is the first case
# with `pampa-2` added: its digest is among the 3 smallest, so `pampa-1`,
# the largest of the 3 that stayed, goes.
#
# `rejectedSeeds` lists seeds that a seeded selection rejects (`ValueError`).
