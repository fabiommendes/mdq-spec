  #
  # Code
  #
  - name: code keeps template, language and file, and lists one entry for each public region
    question:
      type: code
      id: conta-de-luz
      language: python
      file: conta.py
      stem: Escreva a função `valor_conta(kwh, bandeira)`, que devolve o total em reais.
      template: |-
        ```python
        def valor_conta(kwh, bandeira):
            ...
        ```
      tests:
        - format: pytest
          text: |
            import pytest
            from conta import valor_conta

            # mdq: [+3] {example} Acerta os exemplos do enunciado
            # mdq: > Confira a bandeira.
            # mdq: ! Só para o professor.
            def test_verde():
                assert valor_conta(100, "verde") == pytest.approx(80.00)

            def test_amarela():
                assert valor_conta(150, "amarela") == pytest.approx(123.00)

            # mdq: [0] {public} Aceita bandeira em maiúsculas
            def test_maiuscula():
                valor_conta(1, "VERDE")

            # mdq: [+5] Correta para qualquer consumo
            def test_contra_gabarito():
                assert valor_conta(0, "verde") == 0
        - format: py
          origin: test_extra.py
          text: |
            def test_extra(): ...
      rubric:
        - value: 2
          binding: manual
          text: Nomes de variáveis claros
          feedback: Escolha nomes que digam o que a variável guarda.
          comment: Não descontar por nomes em inglês
      answerKey: |-
        ```python
        ADICIONAL = {"verde": 0.00, "amarela": 0.02, "vermelha": 0.05}

        def valor_conta(kwh, bandeira):
            return kwh * (0.80 + ADICIONAL[bandeira])
        ```
    public:
      type: code
      id: conta-de-luz
      language: python
      file: conta.py
      stem: Escreva a função `valor_conta(kwh, bandeira)`, que devolve o total em reais.
      template: |-
        ```python
        def valor_conta(kwh, bandeira):
            ...
        ```
      publicTests:
        - format: pytest
          text: |-
            def test_verde():
                assert valor_conta(100, "verde") == pytest.approx(80.00)

            def test_amarela():
                assert valor_conta(150, "amarela") == pytest.approx(123.00)
          firstLine: 7
          example: true
        - format: pytest
          text: |-
            def test_maiuscula():
                valor_conta(1, "VERDE")
          firstLine: 14
          example: false
    correctResponses:
      - |
        ADICIONAL = {"verde": 0.00, "amarela": 0.02, "vermelha": 0.05}

        def valor_conta(kwh, bandeira):
            return kwh * (0.80 + ADICIONAL[bandeira])

