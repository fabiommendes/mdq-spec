  #
  # Fill in the blanks
  #
  - name: fill-in with the three blank kinds
    question:
      type: fill-in
      grading: partial
      stem: >-
        O Rio [^rio] tem cerca de [^km] km e deságua no oceano [^oceano].
      blanks:
        - id: rio
          type: short-answer
          accept: [Amazonas, "`Solimões`", "/amazon.*/i"]
          preAccept:
            - pattern: "/^[a-zà-ú]+$/i"
              feedback: Uma palavra só.
              comment: Sem números.
          incorrectFeedback: É o maior rio do Brasil.
        - id: km
          type: numeric
          answer: 6992
          unit: km
          tolerance: { relative: 0.05 }
        - id: oceano
          type: multiple-choice
          choices:
            - { id: atlantico, text: Atlântico, score: 1 }
            - { id: pacifico, text: Pacífico, feedback: O Pacífico fica a oeste dos Andes. }
    public:
      type: fill-in
      grading: partial
      stem: >-
        O Rio [^rio] tem cerca de [^km] km e deságua no oceano [^oceano].
      blanks:
        - id: rio
          type: short-answer
          preAccept:
            - pattern: "/^[a-zà-ú]+$/i"
              feedback: Uma palavra só.
          unmatched: incorrect
        - id: km
          type: numeric
          unit: km
          domain: integer
        - id: oceano
          type: multiple-choice
          choices:
            - { id: atlantico, text: Atlântico }
            - { id: pacifico, text: Pacífico }
    correctResponses:
      rio: [Amazonas, Solimões]
      km: [6992]
      oceano: [atlantico]

