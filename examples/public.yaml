      stem: O guaraná é uma planta nativa da [^bioma].
      blanks:
        - id: bioma
          type: multiple-choice
          choices:
            - { id: amazonia, text: Amazônia, score: 1 }
            - { text: Caatinga }
    error: MissingIdError

  #
  # Ordering
  #
  - name: ordering fixed keeps the authored levels and mixes extra lines into the pool
    question:
      type: ordering
      content: text
      stem: Ordene os períodos da história do Brasil.
      lines:
        - [0, Colônia]
        - [1, Ciclo do açúcar]
        - [1, Ciclo do ouro]
        - [0, Império]
        - [0, República]
      extra:
        - [0, Feudalismo]
        - [1, Ciclo do ouro]
      incorrectFeedback: Comece pela chegada dos portugueses.
    public:
      type: ordering
      content: text
      stem: Ordene os períodos da história do Brasil.
      unmatched: incorrect
      pool:
        - [1, Ciclo do açúcar]
        - [1, Ciclo do ouro]
        - [1, Ciclo do ouro]
        - [0, Colônia]
        - [0, Feudalismo]
        - [0, Império]
        - [0, República]
    correctResponses:
      - [[0, Colônia], [1, Ciclo do açúcar], [1, Ciclo do ouro], [0, Império], [0, República]]

  - name: ordering lenient zeroes the levels and lists the accepted orders
    question:
      type: ordering
      content: code
      highlight: python
      indentation: lenient
      stem: Ordene as linhas para somar a população das capitais.
      lines:
        - [0, "total = 0"]
        - [0, "for capital in capitais:"]
        - [1, "total += capital.populacao"]
        - [0, "print(total)"]
      extra:
        - [1, "total -= capital.populacao"]
      accept:
        - lines:
            - [0, "for capital in capitais:"]
            - [0, "total = 0"]
            - [0, "total += capital.populacao"]
            - [0, "print(total)"]
          feedback: Funciona por acaso, mas zere o total antes do laço.
          comment: Com dedent, só a ordem conta.
    public:
      type: ordering
      content: code
      highlight: python
      indentation: lenient
      stem: Ordene as linhas para somar a população das capitais.
      unmatched: incorrect
      maxLevel: 2
      pool:
        - [0, "for capital in capitais:"]
        - [0, "print(total)"]
        - [0, "total += capital.populacao"]
        - [0, "total -= capital.populacao"]
        - [0, "total = 0"]
    correctResponses:
      - [[0, "total = 0"], [0, "for capital in capitais:"], [1, "total += capital.populacao"], [0, "print(total)"]]
      - [[0, "for capital in capitais:"], [0, "total = 0"], [0, "total += capital.populacao"], [0, "print(total)"]]

  - name: ordering keeps blank lines in the pool under skip-blanks
    question:
      type: ordering
      content: code
      indentation: strict
      normalizations: [skip-blanks]
      unmatched: manual
      stem: Ordene os comandos para listar os arquivos do projeto Sirius.
      lines:
        - [0, "cd sirius"]
        - [0, ""]
        - [0, "ls -la"]
    public:
      type: ordering
      content: code
      indentation: strict
      normalizations: [skip-blanks]
      unmatched: manual
      stem: Ordene os comandos para listar os arquivos do projeto Sirius.
      maxLevel: 1
      pool:
        - [0, ""]
        - [0, "cd sirius"]
        - [0, "ls -la"]
    correctResponses:
      - [[0, "cd sirius"], [0, ""], [0, "ls -la"]]

  - name: ordering maxLevel counts the levels of the reject sections
    question:
      type: ordering
      content: code
      highlight: python
      indentation: strict
      stem: Ordene as linhas para listar os biomas do Brasil.
      lines:
        - [0, "for bioma in biomas:"]
        - [1, "print(bioma)"]
      reject:
        - lines:
            - [0, "for bioma in biomas:"]
            - [3, "print(bioma)"]
          feedback: Um nível de recuo basta dentro do laço.
    public:
      type: ordering
      content: code
      highlight: python
      indentation: strict
      stem: Ordene as linhas para listar os biomas do Brasil.
      unmatched: incorrect
      maxLevel: 4
      pool:
        - [0, "for bioma in biomas:"]
        - [0, "print(bioma)"]
    correctResponses:
      - [[0, "for bioma in biomas:"], [1, "print(bioma)"]]
