# base.md, "Frontmatter": a `null` value in any optional field is the same
# as an absent field. `title:`, `author: ~`, `weight: null`, `shuffle: null`
# and `grading: null` all vanish, and `weight` takes its default of 1;
# `shuffle` and `grading` resolve as `inherit`.
id: mc-null-fields
type: multiple-choice
stem: Which Brazilian state has the longest coastline?
choices:
