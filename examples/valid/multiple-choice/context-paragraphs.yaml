id: mc-context-paragraphs
title: Pororoca
type: multiple-choice
stem: |-
  The pororoca is a tidal bore: the sea tide pushes against the current of the Amazon River and a wave travels upstream.

  It happens mostly around the new moon and the full moon, when the tides are strongest.

  What causes the strongest tides on Earth?
choices:
- text: The alignment of the Sun, the Moon and the Earth
  score: 1
- text: The rotation of the Earth around its axis
- text: The wind over the Atlantic Ocean
