# `penalty: capped` keeps each question's full, possibly negative, score
# but floors the *exam total* at 0 -- see
# docs/adr/0001-score-scale-and-exam-level-clamping.md. The wrong choice
# below carries a negative score (`-50%` -> -0.5); it survives into the
# total under "capped" (or "full"), but would be floored to 0 before
# weighting under the default "none".
type: exam
id: climate-quiz
title: Climate and Biomes Quiz
course: GEO201
penalty: capped
instructions: Answer every question. Wrong guesses cost you here.
questions:
  - type: multiple-choice
    stem: Which is Brazil's largest biome by area?
    choices:
      - text: Amazon rainforest
        score: 1
      - text: Cerrado
        score: -0.5
      - text: Atlantic Forest
        score: 0
      - text: Caatinga
        score: 0
