# An exam is recognized by its H1 title, which a question can never have.
# Note the three block forms: an `include` reference, a question opened by
# its own `---` frontmatter, and one opened by a `===` separator.
#
# `include` is left unresolved here -- resolution is a loader's job, and a
# document that has not been resolved is still well-formed. The third
# question gets the implicit id `q3` because blocks are numbered by
# position and the `include` occupies position 1.
#
# Both inline questions inherit `author` and `locale` from the exam; the
# exam's `course` is not inherited.
type: exam
id: midterm
title: Midterm Exam
course: CS101
author: Fábio Macêdo Mendes
locale: pt-BR
instructions: Answer every question. You have two hours.
questions:
  - include: recursion-01
  - id: factorial
    type: essay
    stem: Converta este algoritmo iterativo em um recursivo.
    author: Fábio Macêdo Mendes
    locale: pt-BR
  - id: q3
    type: true-false
    stem: Julgue as afirmações.
    author: Fábio Macêdo Mendes
    locale: pt-BR
    choices:
      - id: todo-algoritmo-iterativo-pode-ser-implementado-recursivamente
        text: Todo algoritmo iterativo pode ser implementado recursivamente.
        correct: true
        marker: V
      - id: recursao-tende-a-ser-mais-eficiente-em-memoria-que-iteracao
        text: Recursão tende a ser mais eficiente em memória que iteração.
        correct: false
        marker: F
