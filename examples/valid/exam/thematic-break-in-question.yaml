# Regression fixture for the `_split_exam_blocks` ambiguity between a
# thematic break inside a question's own preamble and the `---` fence
# that opens a *later* question's frontmatter. The "extent" question's
# preamble contains a bare `---` positioned mid-block (real content
# already precedes it), so it must stay a thematic break no matter what
# its enclosed text looks like -- it is not immediately after any block
# boundary, so position alone already rules it out.
type: exam
id: amazon-quiz
title: Amazon Quiz
instructions: Answer every question about the Amazon rainforest.
questions:
  - id: extent
    type: short-answer
    preamble: |-
        The Amazon rainforest spans nine countries in South America.

        ---

        Most of its area, however, lies within a single country.
    stem: >-
      Which country contains the largest share of the Amazon rainforest?
    oneOf:
      - Brazil
  - type: true-false
    stem: Judge the statements about the Amazon basin.
    choices:
      - text: The Amazon River discharges more fresh water into the ocean than any other river.
        correct: true
        marker: V
      - text: The Amazon rainforest is the coldest biome in South America.
        correct: false
        marker: F
  - type: numeric
    stem: >-
      What is the approximate area of the Amazon rainforest, in million
      square kilometers?
    answer: 5.5
    domain: decimal
    decimalPlaces: 1
    tolerance:
      relative: 0.1
