# question-base.md, "Attachments": the forms of a link and of a fence.
# - A label equal to the name is omitted, and a link text with no visible
#   character gives no label.
# - The label is plain text: the markup of emphasis and code spans is removed.
# - The name is the last segment of the origin: a space in a directory is valid.
# - `%20` is not decoded.
# - The origin and the info string are read after the backslash escapes and the
#   entity references of CommonMark.
# - A fence name needs no extension, and spaces around the words do not count.
id: vazao-de-itaipu
title: Vazão de Itaipu
type: numeric
stem: >-
  Com os dados dos anexos, qual foi a vazão média do rio Paraná em Itaipu, em
  m³/s?
answer: 11000
tolerance:
  absolute: 500
domain: integer
