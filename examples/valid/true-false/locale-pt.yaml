# `V`/`F` -- verdadeiro/falso -- rather than `T`/`F`. Both spell the same
# two booleans; `marker` is what records which spelling was used, and the
# locale is what makes `V` the expected one here.
id: tf-geografia
title: Geografia do Brasil
type: true-false
locale: pt-BR
stem: Julgue as alternativas.
choices:
  - text: Brasília é a capital do Brasil.
    correct: true
    marker: V
  - text: O Rio Amazonas deságua no Oceano Pacífico.
    correct: false
    marker: F
  - text: O Brasil faz fronteira com a Argentina.
    correct: true
    marker: V
