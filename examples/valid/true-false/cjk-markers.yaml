# The CJK markers of true-false.md, "Body": 对 and 真 are TRUE, 错 and 偽
# are FALSE. `locale: zh-Hans-CN` has no marker expectation, so no warning.
id: tf-cjk-markers
title: 关于巴西的陈述
type: true-false
locale: zh-Hans-CN
stem: 判断下列关于巴西的陈述。
choices:
