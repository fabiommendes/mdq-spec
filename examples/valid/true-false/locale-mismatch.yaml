# A pt-BR question with `B` for true. Valid, and graded exactly as written --
# the locale never reinterprets a marker -- but `B` is a TRUE letter that the
# `pt` row does not accept, so it gets `locale-mismatched-true-false-marker`.
type: true-false
locale: pt-BR
stem: Julgue as alternativas.
choices:
  - text: Brasília é a capital do Brasil.
    correct: true
    marker: B
  - text: O Brasil faz fronteira com o Chile.
    correct: false
    marker: F
