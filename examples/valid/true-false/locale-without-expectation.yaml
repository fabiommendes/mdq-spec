# `locale: nl` is not in the table of true-false.md, "Locale", so `T` and `F`
# raise no locale warning. `W` is a WARNING-category letter and gets
# `unlisted-true-false-marker` regardless of locale.
id: tf-locale-nl
title: Uitspraken over Brazilië
type: true-false
locale: nl
stem: Beurteilen Sie die Uitspraken over Brazilië.
choices:
- text: Brazilië is het grootste land van Zuid-Amerika.
  correct: true
  marker: T
- text: De hoofdstad van Brazilië is Rio de Janeiro.
  correct: false
  marker: F
- text: De Amazone stroomt door Brazilië.
  correct: true
  marker: W
