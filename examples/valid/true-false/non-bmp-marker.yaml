# DESERET CAPITAL LETTER LONG I (U+10400) is one code point of category
# `Lu`, so it is a valid marker, in the WARNING category. It takes two
# UTF-16 code units: a `maxLength: 1` check must count code points. It
# is its own NFKC form, so no info diagnostic is issued.
id: tf-non-bmp-marker
title: Fatos sobre o rio Amazonas
type: true-false
stem: Julgue as afirmações sobre o rio Amazonas.
choices:
  - id: a
    text: O rio Amazonas é o mais caudaloso do mundo.
    correct: true
    marker: "𐐀"
  - id: b
    text: O rio Amazonas nasce no Brasil.
    correct: false
    marker: F
