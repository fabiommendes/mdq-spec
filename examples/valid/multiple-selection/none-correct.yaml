# Zero correct choices is legal for multiple-selection (unlike
# multiple-choice, which needs exactly one). An all-blank body is exactly
# how that is written, so it infers as multiple-selection -- no `type` in
# the frontmatter is needed.
id: ms-none-correct
type: multiple-selection
stem: Which of these numbers are prime?
choices:
  - id: one
    text: "1"
  - id: four
    text: "4"
  - id: nine
    text: "9"
