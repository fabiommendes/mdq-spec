id: essay-answer-key
title: Greenhouse effect
type: essay
stem: Describe how the greenhouse effect works and how it affects the climate.
answerKey: >-
  The greenhouse effect is a natural process that warms the Earth's surface.
  Greenhouse gases such as carbon dioxide, methane, and water vapor trap part of
  the infrared radiation the Earth emits, keeping the surface and lower
  atmosphere warm enough to be habitable. Human activity has raised the
  concentration of those gases, enhancing the effect and driving global warming.
