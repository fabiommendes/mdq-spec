type: essay
preamble: |-
    During the voyage of the Beagle, Charles Darwin spent time exploring the Tijuca Forest near Rio de Janeiro in 1832 and filled his notebooks with descriptions of the plants and insects he found there.

    ---

    Decades later, those same notebooks fed directly into the argument he built in On the Origin of Species.
stem: >-
  Explain how field observations like the ones Darwin made in Brazil
  support the theory of evolution by natural selection.
