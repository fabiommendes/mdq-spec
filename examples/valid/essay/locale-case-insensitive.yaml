# region subtag, so a lowercase one like this failed to load.
id: locale-case-insensitive
title: Locale em minúsculas
type: essay
input: text
locale: pt-br
stem: Explique por que o Pantanal é considerada a maior planície alagável do mundo.
answerKey: O relevo baixo e plano da bacia do rio Paraguai favorece o alagamento sazonal.
