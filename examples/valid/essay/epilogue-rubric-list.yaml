type: essay
preamble: >-
  The giant water lily Victoria amazonica, native to the Amazon basin, can
  grow leaves wide enough to support the weight of a small child.
stem: >-
  Explain how the leaf's structure lets it support that weight without
  sinking.
epilogue: |-
    1. Award credit for mentioning the ribbed underside that traps air.
    2. Award credit for mentioning the large surface area spreading the load.
    3. Deduct credit if the answer attributes this only to surface tension.
