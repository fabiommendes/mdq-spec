id: essay-context
title: Context switching
type: essay
preamble: >-
  Operating systems must decide which process runs at any given time on a
  CPU core. This decision involves saving and restoring process state.
stem: >-
  Explain what a context switch is and describe two costs associated with
  performing one.
epilogue: >-
  Your answer should be understandable to a second-year undergraduate
  student who has taken an introductory OS course.
