# `preAccept`/`preReject` are pre-submission validators, not grading
# rules: a system warns the student before accepting the submission, and
# a response matching both is treated as rejected -- the opposite of the
# accept/reject precedence used when grading.
id: sa-year
title: Independence of Brazil
type: short-answer
stem: In which year did Brazil declare its independence from Portugal?
preAccept:
  - /\d{4}/
preReject:
  - pattern: /\d{4}\s*(?:AD|CE)/i
    feedback: Write the year on its own, without an era suffix.
oneOf:
  - "1822"
