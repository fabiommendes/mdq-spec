# A single accept list mixing an exact and an inexact pattern:
# `math.isnan` must match verbatim, while "not a number" is normalized
# the way any bare literal is.
id: sa-isnan
title: Checking for NaN
type: short-answer
stem: Which **Python** function is used to check if a number is NaN?
accept:
  - pattern: "`math.isnan`"
    feedback: Correct -- that is the exact name of the function.
  - pattern: not a number
    feedback: Correct -- that is the acronym.
