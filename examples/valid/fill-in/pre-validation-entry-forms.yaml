# `preAccept` and `preReject` land on the blank they name, as written: plain
# strings, a backtick literal and mappings with `feedback` or `comment`. Both
# lists may target the same blank; the other blank has neither key.
id: fill-in-pre-entry-forms
title: Pantanal states
type: fill-in
stem: >-
  The Pantanal lies mostly in the state of [^state] and floods during the
  [^season] season.
blanks:
  - id: state
    type: short-answer
    preAccept:
      - Mato Grosso
      - "`a.b`"
      - pattern: "/^[A-Za-z ]+$/i"
        feedback: Write the name of the state.
    preReject:
      - pattern: "/\\d+/"
        comment: Digits are not a name.
    accept:
      - Mato Grosso do Sul
      - Mato Grosso
  - id: season
    type: short-answer
    accept:
      - rainy
      - wet
