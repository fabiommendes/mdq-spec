# A `[^id]` outside the stem is literal text: in a fenced code block of the
# preamble, in a code span, and in an epilogue paragraph. Only the stem
# reference counts (fill-in.md, "Where blanks may appear").
type: fill-in
preamble: 'Em MDQ, um blank é escrito assim:


  ```md

  A capital é [^capital].

  ```'
stem: 'Complete: a capital do Brasil é [^capital].'
blanks:
- id: capital
  type: short-answer
  accept:
  - Brasília
epilogue: 'Lembre que `[^capital]` no epílogo também é só texto: [^capital].'
