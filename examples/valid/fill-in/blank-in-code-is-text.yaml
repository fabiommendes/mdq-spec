# A `[^id]` is literal text in a fenced code block of the stem and in an
# epilogue paragraph. Only the reference in a plain text run of a stem
# paragraph counts (fill-in.md, "Where blanks may appear").
type: fill-in
stem: |-
  Em MDQ, um blank é escrito assim:

  ```md
  A capital é [^capital].
  ```

  Complete: a capital do Brasil é [^capital].
blanks:
- id: capital
  type: short-answer
  accept:
  - Brasília
epilogue: 'Lembre que `[^capital]` no epílogo também é só texto: [^capital].'
