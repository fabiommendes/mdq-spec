# A stem that starts with a blank, after a context paragraph. A paragraph starting
# with `[^` is never a forbidden element (base.md, "Forbidden elements").
type: fill-in
stem: |-
  Leia o texto e complete.

  [^capital] é a capital do Brasil desde 1960.
blanks:
- id: capital
  type: short-answer
  accept:
  - Brasília
