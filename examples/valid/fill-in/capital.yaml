id: fill-in-capital
title: Brazilian capital
type: fill-in
stem: The capital of Brazil is [^capital]. It has approximately [^size] habitants.
blanks:
  - id: capital
    type: multiple-choice
    choices:
      - text: Lisbon
      - text: Brasília
        score: 1
      - text: São Paulo
      - text: Rio de Janeiro
  - id: size
    type: numeric
    answer: 2800000
    domain: integer
    tolerance:
      relative: 0.1
