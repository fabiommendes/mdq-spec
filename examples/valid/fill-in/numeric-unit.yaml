# A unit of measurement attaches to the `numeric` kind and to no other:
# `[^length/numeric(km)]`. A unit is meaningless for a choice or a piece
# of text, so the tag grammar has nowhere to write one.
id: fill-in-amazon
title: The Amazon
type: fill-in
stem: >-
  The [^river] carries more water than any other river on Earth, running
  approximately [^length] before it reaches the Atlantic.
blanks:
  - id: river
    type: short-answer
    oneOf:
      - Amazon
  - id: length
    type: numeric
    answer: 6400
    unit: km
    domain: integer
    tolerance:
      relative: 0.05
