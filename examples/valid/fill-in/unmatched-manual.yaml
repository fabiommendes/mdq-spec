# `unmatched` applies to every short answer blank of the question, like
# `diacritics`. A response to `dark` that matches no pattern goes to the
# instructor, so the question is `semi-automatic`; the numeric blank is
# always automatic.
id: fill-in-encontro
title: Meeting of Waters
type: fill-in
stem: >-
  Near Manaus, the [^dark] meets the Solimões and the two run side by side
  for about [^length] kilometers before they mix.
unmatched: manual
blanks:
  - id: dark
    type: short-answer
    accept:
      - Rio Negro
      - Negro
  - id: length
    type: numeric
    answer: 6
    domain: integer
    tolerance:
      absolute: 1
