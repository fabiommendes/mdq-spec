# A short answer blank takes the same answer machinery as a standalone
# short-answer question. The accept and reject lists are written as
# separate definitions sharing the blank's slug, and merge into the one
# blank, which keeps the position where `planet` first appears.
#
# Backticks make `Jove` an exact literal; the bare `Jupiter` is matched
# inexactly. A response that matches no pattern is incorrect: the blank
# has an `accept` pattern, so its `unmatched` defaults to `incorrect`.
id: fill-in-largest-planet
title: Largest planet
type: fill-in
stem: >-
  The largest planet in the Solar System is [^planet], and the Great Red Spot
  on its surface is a [^feature].
blanks:
  - id: planet
    type: short-answer
    accept:
      - Jupiter
      - pattern: "`Jove`"
        feedback: The archaic name, accepted here.
    reject:
      - pattern: Saturn
        feedback: Second largest, but not the largest.
  - id: feature
    type: multiple-choice
    choices:
      - text: an impact crater
      - text: a storm
        score: 1
      - text: a volcano
