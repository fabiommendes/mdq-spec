# base.md, "Forbidden elements": an unordered list whose items all start with
# `[` could be mistaken for a choice list, so the stem must not hold
# one. JSON Schema sees only a string, so this passes the schema.
type: essay
stem: |-
  Antes de responder, confira:

  * [ ] Li o enunciado.
  * [ ] Tenho uma caneta.

  Explique o ciclo da água.
