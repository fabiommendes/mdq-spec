# `T` followed by U+0308 COMBINING DIAERESIS is one grapheme but two code
# points, and its NFKC form is two code points too, so it is not a letter in
# the sense of true-false.md, "Body". The schema's `maxLength: 1` counts code
# points and rejects it too.
type: true-false
stem: Julgue as afirmações sobre o Pantanal.
choices:
  - text: O Pantanal é a maior planície alagável do planeta.
    correct: true
    marker: "T\u0308"
  - text: O Pantanal fica no litoral brasileiro.
    correct: false
    marker: F
