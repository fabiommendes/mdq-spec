# meaning; a true-false marker must never be `X` or `x`. JSON Schema
# only checks that `marker` is a single letter, so this passes the
# schema and is only rejected by the `reserved-true-false-marker` model
# validator (true-false.md, "Additional Rules").
type: true-false
stem: Julgue as afirmações sobre a fauna brasileira.
choices:
