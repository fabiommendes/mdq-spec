# A unit belongs to a numeric blank only. `unit` is not a property of a
# short answer blank, so the document is rejected -- the surface syntax
# has no way to write `[^planet/short-answer(km)]` either.
type: fill-in
stem: The largest planet is [^planet].
blanks:
  - id: planet
    type: short-answer
    unit: km
    oneOf:
      - Jupiter
