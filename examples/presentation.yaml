# Vectors for the presented form of a question and for the translation of
# its responses (docs/public-form.md, "Presented form").
#
# Document structure
#
# Case {
#   name: string
#
#   // The host seed. A string without U+0000.
#   seed: string
#
#   // The question in its YAML form, with `type`. Every choice has an id.
#   question: { type: string, ... }
#
#   // The `shuffle` of the presentation. When absent, the effective
#   // `shuffle` of the question applies (`inherit` is false).
#   shuffle?: boolean
#
#   // The presented form: the public form with the choices of each scope
#   // in the presented order and the labels in place of the choice ids.
#   presented: object
#
#   // Pairs of a response and its presented form. `real` is the response
#   // of docs/responses.md (ids), `presented` the same response with
#   // labels. Both directions must hold: real -> presented and
#   // presented -> real. An entry with `error` has only one of them, and
#   // translating it in its direction fails with that error: `presented`
#   // goes to the real response, `real` goes to the presented form.
#   responses: { real?: any, presented?: any, error?: "ResponseError" }[]
#
#   // The name of another case. Every choice id that both questions share
#   // has the same label in both (same seed, same question id), except
#   // the ids in `changed`, whose labels differ.
#   stableWith?: string
#   changed?: string[]
# }
#
# The labels are computed with `hashlib` from the seed, the key parts and
# the choice id, joined by U+0000, as the rules of the document say. For
# example, the label of `correct` in the first case is the first 8 digits of
#
#   sha256("s3cr3t\0encontro-das-aguas\0correct")
#
# The case "only the colliding labels grow to 16 digits" uses
# the seed `colisao` and the question id `prefixo-de-oito`. Its first two
# choice ids were found by trying `c0`, `c1`, `c2`, ... in order, until two
# of them gave digests with the same first 8 digits. The search stopped at
# the first collision. The other choices of the question keep 8 digits.
cases:

  - name: multiple choice with shuffle true sorts the choices by label
    seed: s3cr3t
    question:
      type: multiple-choice
      id: encontro-das-aguas
      stem: Which two rivers meet near Manaus without mixing for several kilometers?
      choices:
      - {id: correct, text: Negro and Solimões, score: 1}
      - {id: wrong-1, text: Madeira and Tapajós, feedback: They meet farther south.}
      - {id: wrong-2, text: Xingu and Araguaia}
      - {id: wrong-3, text: Tocantins and São Francisco}
      shuffle: true
    presented:
      type: multiple-choice
      id: encontro-das-aguas
      stem: Which two rivers meet near Manaus without mixing for several kilometers?
      shuffle: true
      choices:
      - {id: "16a68ed6", text: Tocantins and São Francisco}
      - {id: "7589d676", text: Madeira and Tapajós}
      - {id: "78426fb7", text: Xingu and Araguaia}
      - {id: "f412a138", text: Negro and Solimões}
    responses:
    - {real: correct, presented: "f412a138"}
    - {real: wrong-2, presented: "78426fb7"}

