# Document structure
#
# Question {
#   name: string
#
#   // The question's own fields, as in its YAML form: `content`, `lines`
#   // and any of `extra`, `accept`, `reject`, `indentation`, `unmatched`,
#   // `incorrectFeedback`, `normalizations`.
#   question: { content: string, lines: [number, string][], ... }
#
#   // Responses and what they score (ordering.md, "Response" and
#   // "Grading"). A response is a list of `[level, text]` pairs.
#   // "malformed" is a response the question cannot represent: it is
#   // rejected, never scored (responses.md, "Errors"). "pending" is a
#   // response no declared answer matches under `unmatched: manual`.
#   examples: {
#     response: [number, string][],
#     score: 0 | 1 | "malformed" | "pending",
#     // Optional. The feedback shown, or null for none: the feedback of
#     // the matched `accept` or `reject` entry, else `incorrectFeedback`
#     // for an incorrect response (ordering.md, "Feedback").
#     feedback?: string | null
#   }[]
# }
questions:
  # Under `fixed` the student cannot change levels, so a text response that
  # is not a valid outline is a wrong answer, not a malformed one.
  - name: "Fixed, text, default unmatched (incorrect)"
    question:
      content: text
      lines:
        - [0, "Nordeste"]
        - [1, "Bahia"]
        - [2, "Salvador"]
    examples:
      - response: [[0, "Nordeste"], [1, "Bahia"], [2, "Salvador"]]
        score: 1
      # First line below level 0.
      - response: [[2, "Salvador"], [0, "Nordeste"], [1, "Bahia"]]
        score: 0
      # A jump of two levels.
      - response: [[0, "Nordeste"], [2, "Salvador"], [1, "Bahia"]]
        score: 0
      # A level other than the authored one.
      - response: [[0, "Nordeste"], [0, "Bahia"], [2, "Salvador"]]
        score: malformed

  # The response is a list of pairs. An empty string or an empty mapping is
  # not the empty list: it is malformed, not a response that matches nothing.
  - name: "Response that is not a list"
    question:
      content: text
      lines:
        - [0, "Nordeste"]
        - [1, "Bahia"]
    examples:
      - response: ""
        score: malformed
      - response: "Nordeste"
        score: malformed
      - response: {}
        score: malformed
      - response: { Nordeste: 0 }
        score: malformed
      - response: []
        score: 0

  - name: "Fixed, text, unmatched manual"
    question:
      content: text
      unmatched: manual
      lines:
        - [0, "Nordeste"]
        - [1, "Bahia"]
        - [2, "Salvador"]
    examples:
      - response: [[2, "Salvador"], [0, "Nordeste"], [1, "Bahia"]]
        score: pending

  # Under `lenient` and `strict` the student sets the levels, so an
  # invalid outline stays malformed.
  - name: "Strict, text"
    question:
      content: text
      indentation: strict
      unmatched: incorrect
      lines:
        - [0, "Nordeste"]
        - [1, "Bahia"]
        - [2, "Salvador"]
    examples:
      - response: [[0, "Nordeste"], [1, "Bahia"], [2, "Salvador"]]
        score: 1
      - response: [[0, "Nordeste"], [1, "Salvador"], [2, "Bahia"]]
        score: 0
      - response: [[2, "Salvador"], [0, "Nordeste"], [1, "Bahia"]]
        score: malformed
      - response: [[0, "Nordeste"], [2, "Salvador"], [1, "Bahia"]]
        score: malformed

  - name: "Lenient, text"
    question:
      content: text
      indentation: lenient
      unmatched: incorrect
      lines:
        - [0, "Nordeste"]
        - [1, "Bahia"]
        - [2, "Salvador"]
    examples:
      - response: [[0, "Nordeste"], [0, "Bahia"], [0, "Salvador"]]
        score: 1
      - response: [[1, "Bahia"], [0, "Nordeste"]]
        score: malformed
      # A jump of two levels.
      - response: [[0, "Nordeste"], [2, "Salvador"]]
        score: malformed

  # `incorrectFeedback` is for an incorrect response that no `reject`
  # entry gave feedback to. The feedback of an entry wins. A correct
  # response and a pending response show none.
  - name: "incorrectFeedback"
    question:
      content: text
      incorrectFeedback: "Review the political map of Brazil."
      lines:
        - [0, "Norte"]
        - [0, "Nordeste"]
        - [0, "Sul"]
      reject:
        - lines:
            - [0, "Nordeste"]
            - [0, "Norte"]
            - [0, "Sul"]
        - feedback: "Norte is larger than Nordeste."
          lines:
            - [0, "Sul"]
            - [0, "Nordeste"]
            - [0, "Norte"]
    examples:
      - response: [[0, "Norte"], [0, "Nordeste"], [0, "Sul"]]
        score: 1
        feedback: null
      # Matches no declared answer.
      - response: [[0, "Sul"], [0, "Norte"], [0, "Nordeste"]]
        score: 0
        feedback: "Review the political map of Brazil."
      # A `reject` entry with no feedback.
      - response: [[0, "Nordeste"], [0, "Norte"], [0, "Sul"]]
        score: 0
        feedback: "Review the political map of Brazil."
      # A `reject` entry with feedback.
      - response: [[0, "Sul"], [0, "Nordeste"], [0, "Norte"]]
        score: 0
        feedback: "Norte is larger than Nordeste."

  - name: "incorrectFeedback is not shown for a pending response"
    question:
      content: text
      unmatched: manual
      incorrectFeedback: "Review the political map of Brazil."
      lines:
        - [0, "Norte"]
        - [0, "Nordeste"]
        - [0, "Sul"]
    examples:
      - response: [[0, "Sul"], [0, "Norte"], [0, "Nordeste"]]
        score: pending

  # Code content: the lines are compared as they are. Under `fixed` a level
  # other than the authored one is malformed, and a wrong order is a wrong
  # answer, as for text.
  - name: "Fixed, code"
    question:
      content: code
      lines:
        - [0, "for x in chuvas:"]
        - [1, "total += x"]
        - [0, "print(total)"]
    examples:
      - response: [[0, "for x in chuvas:"], [1, "total += x"], [0, "print(total)"]]
        score: 1
      - response: [[0, "print(total)"], [0, "for x in chuvas:"], [1, "total += x"]]
        score: 0
      # The authored level of `total += x` is 1.
      - response: [[0, "for x in chuvas:"], [0, "total += x"], [0, "print(total)"]]
        score: malformed

  # `lenient` implies `dedent`: the student sets the levels, and they take no
  # part in the comparison.
  - name: "Lenient, code"
    question:
      content: code
      indentation: lenient
      lines:
        - [0, "for x in chuvas:"]
        - [1, "total += x"]
        - [0, "print(total)"]
    examples:
      - response: [[0, "for x in chuvas:"], [0, "total += x"], [0, "print(total)"]]
        score: 1
      - response: [[0, "for x in chuvas:"], [3, "total += x"], [0, "print(total)"]]
        score: 1
      - response: [[0, "total += x"], [0, "for x in chuvas:"], [0, "print(total)"]]
        score: 0

  # `dedent` flattens every level on both sides, under `fixed` too.
  - name: "Fixed with dedent"
    question:
      content: code
      normalizations: [dedent]
      lines:
        - [0, "for x in chuvas:"]
        - [1, "total += x"]
    examples:
      - response: [[0, "for x in chuvas:"], [1, "total += x"]]
        score: 1
      - response: [[1, "total += x"], [0, "for x in chuvas:"]]
        score: 0

  # `skip-blanks` leaves the blank lines out on both sides: the response
  # may keep them, drop them or move them.
  - name: "skip-blanks"
    question:
      content: code
      normalizations: [skip-blanks]
      lines:
        - [0, "total = 0"]
        - [0, ""]
        - [0, "print(total)"]
    examples:
      - response: [[0, "total = 0"], [0, ""], [0, "print(total)"]]
        score: 1
      - response: [[0, "total = 0"], [0, "print(total)"]]
        score: 1
      - response: [[0, ""], [0, "total = 0"], [0, "print(total)"]]
        score: 1
      - response: [[0, "print(total)"], [0, ""], [0, "total = 0"]]
        score: 0

  # Without `skip-blanks`, a blank line is a line like any other.
  - name: "Blank line without skip-blanks"
    question:
      content: code
      lines:
        - [0, "total = 0"]
        - [0, ""]
        - [0, "print(total)"]
    examples:
      - response: [[0, "total = 0"], [0, ""], [0, "print(total)"]]
        score: 1
      - response: [[0, "total = 0"], [0, "print(total)"]]
        score: 0

  # A response may leave lines out: it is graded as an `accept` section that
  # omits lines is.
  - name: "Omitted lines"
    question:
      content: text
      indentation: lenient
      lines:
        - [0, "Norte"]
        - [0, "Nordeste"]
        - [0, "Sul"]
      accept:
        - lines:
            - [0, "Norte"]
            - [0, "Sul"]
    examples:
      - response: [[0, "Norte"], [0, "Nordeste"], [0, "Sul"]]
        score: 1
      - response: [[0, "Norte"], [0, "Sul"]]
        score: 1
      - response: [[0, "Norte"], [0, "Nordeste"]]
        score: 0
      - response: [[0, "Sul"], [0, "Norte"]]
        score: 0

  # When a response matches more than one declared answer, the feedback of
  # the first match in document order is shown. Under `lenient` the two
  # `accept` entries are equal after normalization.
  - name: "First match gives the feedback"
    question:
      content: text
      indentation: lenient
      lines:
        - [0, "Nordeste"]
        - [0, "Bahia"]
      accept:
        - feedback: "First."
          lines:
            - [0, "Bahia"]
            - [1, "Nordeste"]
        - feedback: "Second."
          lines:
            - [0, "Bahia"]
            - [0, "Nordeste"]
    examples:
      - response: [[0, "Bahia"], [0, "Nordeste"]]
        score: 1
        feedback: "First."

  # A correct response is any response equal to a declared answer after
  # normalization, whatever pool lines it uses. Here the distractor
  # `total += x` is another copy of a line the response needs, and the
  # response may use either.
  - name: "Distractor copy of a line"
    question:
      content: code
      normalizations: [dedent]
      lines:
        - [0, "for x in chuvas:"]
        - [1, "total += x"]
      extra:
        - [0, "total += x"]
    examples:
      - response: [[0, "for x in chuvas:"], [1, "total += x"]]
        score: 1
      - response: [[0, "for x in chuvas:"], [0, "total += x"]]
        score: 1

  # The empty response `[]` is graded like any other. No `lines` or `accept`
  # entry is empty after normalization, so it is never correct.
  - name: "Empty response"
    question:
      content: text
      lines:
        - [0, "Norte"]
        - [0, "Sul"]
    examples:
      - response: []
        score: 0

  - name: "Empty response, unmatched manual"
    question:
      content: text
      unmatched: manual
      lines:
        - [0, "Norte"]
        - [0, "Sul"]
    examples:
      - response: []
        score: pending

  # An empty `reject` entry matches the empty response and gives it feedback.
  - name: "Empty response matches an empty reject entry"
    question:
      content: code
      normalizations: [skip-blanks]
      lines:
        - [0, "total = 0"]
        - [0, "print(total)"]
      reject:
        - feedback: "Write the program."
          lines:
            - [0, ""]
    examples:
      - response: []
        score: 0
        feedback: "Write the program."
      - response: [[0, ""]]
        score: 0
        feedback: "Write the program."

  # An incorrect response with no matching entry and no `incorrectFeedback`
  # shows no feedback.
  - name: "Unmatched incorrect shows no feedback"
    question:
      content: text
      lines:
        - [0, "Norte"]
        - [0, "Sul"]
    examples:
      - response: [[0, "Sul"], [0, "Norte"]]
        score: 0
        feedback: null

  # The answer key is matched before every `accept` entry, so an entry equal
  # to it never gives its feedback.
  - name: "Answer key wins over an equal accept entry"
    question:
      content: text
      lines:
        - [0, "Norte"]
        - [0, "Sul"]
      accept:
        - feedback: "Late."
          lines:
            - [0, "Norte"]
            - [0, "Sul"]
    examples:
      - response: [[0, "Norte"], [0, "Sul"]]
        score: 1
        feedback: null

  # The pool is the `lines` plus the `extra` lines. Under `fixed` a line is
  # drawn at its authored level, and a distractor that differs from a key
  # line only by its level is a wrong answer.
  - name: "Fixed pool with level-only distractor"
    question:
      content: code
      lines:
        - [0, "total = 0"]
        - [0, "for x in chuvas:"]
        - [1, "total += x"]
        - [0, "print(total)"]
      extra:
        - [1, "print(total)"]
    examples:
      - response: [[0, "total = 0"], [0, "for x in chuvas:"], [1, "total += x"], [0, "print(total)"]]
        score: 1
      - response: [[0, "total = 0"], [0, "for x in chuvas:"], [1, "total += x"], [1, "print(total)"]]
        score: 0
      # Leaving lines out is graded, not malformed.
      - response: [[0, "total = 0"]]
        score: 0
      # The distractor exists only at level 1.
      - response: [[2, "print(total)"]]
        score: malformed
      # A line outside the pool.
      - response: [[0, "total = 0"], [0, "return total"]]
        score: malformed

  # `dedent` flattens the levels, so the level-only distractor is equal to
  # the key line.
  - name: "Fixed with dedent and level-only distractor"
    question:
      content: code
      normalizations: [dedent]
      lines:
        - [0, "for x in chuvas:"]
        - [1, "total += x"]
      extra:
        - [0, "print(total)"]
        - [1, "print(total)"]
    examples:
      - response: [[0, "for x in chuvas:"], [1, "total += x"], [1, "print(total)"]]
        score: 0
      - response: [[0, "for x in chuvas:"], [1, "total += x"]]
        score: 1

  # A response draws each line at most as many times as the pool offers it.
  - name: "Pool copies"
    question:
      content: code
      lines:
        - [0, "a = 1"]
        - [1, "b = 2"]
        - [1, "b = 2"]
        - [0, "c = 3"]
      extra:
        - [0, "d = 4"]
    examples:
      - response: [[1, "b = 2"], [1, "b = 2"], [0, "d = 4"]]
        score: 0
      - response: [[0, "a = 1"], [0, "a = 1"]]
        score: malformed
      - response: [[1, "b = 2"], [1, "b = 2"], [1, "b = 2"]]
        score: malformed
      - response: [[0, "a = 1"], [0, "zzz"]]
        score: malformed

  # Under `skip-blanks` a blank line is outside the pool check.
  - name: "Blank line outside the pool under skip-blanks"
    question:
      content: code
      normalizations: [skip-blanks]
      lines:
        - [0, "a = 1"]
        - [0, "b = 2"]
    examples:
      - response: [[0, ""], [0, "a = 1"]]
        score: 0

  # Under `strict` and `lenient` the student sets the levels, so the pool
  # is compared by text.
  - name: "Strict pool compared by text"
    question:
      content: code
      indentation: strict
      lines:
        - [0, "for x in chuvas:"]
        - [1, "total += x"]
      extra:
        - [0, "print(total)"]
    examples:
      - response: [[0, "for x in chuvas:"], [1, "total += x"]]
        score: 1
      # A changed level is a non-match under `strict`.
      - response: [[0, "for x in chuvas:"], [0, "total += x"]]
        score: 0
      # A level never authored.
      - response: [[5, "for x in chuvas:"], [3, "print(total)"]]
        score: 0
      - response: [[0, "print(total)"], [0, "print(total)"]]
        score: malformed
      - response: [[0, "zzz"]]
        score: malformed

  - name: "Lenient pool compared by text"
    question:
      content: code
      indentation: lenient
      lines:
        - [0, "for x in chuvas:"]
        - [1, "total += x"]
      extra:
        - [0, "print(total)"]
    examples:
      - response: [[5, "for x in chuvas:"], [3, "total += x"]]
        score: 1
      - response: [[5, "for x in chuvas:"], [3, "print(total)"]]
        score: 0
      - response: [[0, "print(total)"], [0, "print(total)"]]
        score: malformed

  # A distractor alone is not an outline in a text response. Under `fixed`
  # the student cannot change levels: a wrong answer. Under `lenient` and
  # `strict` it is malformed.
  - name: "Fixed text, distractor alone"
    question:
      content: text
      lines:
        - [0, "Nordeste"]
        - [1, "Bahia"]
      extra:
        - [2, "Sergipe"]
    examples:
      - response: [[2, "Sergipe"]]
        score: 0

  - name: "Lenient text, distractor alone"
    question:
      content: text
      indentation: lenient
      lines:
        - [0, "Nordeste"]
        - [1, "Bahia"]
      extra:
        - [2, "Sergipe"]
    examples:
      - response: [[2, "Sergipe"]]
        score: malformed

  - name: "Strict text, distractor alone"
    question:
      content: text
      indentation: strict
      lines:
        - [0, "Nordeste"]
        - [1, "Bahia"]
      extra:
        - [2, "Sergipe"]
    examples:
      - response: [[2, "Sergipe"]]
        score: malformed

  # Code content: a response may jump levels. Under `fixed` the code
  # response keeps the authored levels.
  - name: "Code response jumps levels"
    question:
      content: code
      indentation: lenient
      lines:
        - [0, "a = 1"]
        - [1, "b = 2"]
        - [2, "c = 3"]
    examples:
      - response: [[0, "a = 1"], [2, "c = 3"]]
        score: 0
      - response: [[0, "a = 1"], [3, "b = 2"], [0, "c = 3"]]
        score: 1

  # An entry that is not a `[level, text]` pair of an integer and a string
  # makes the response malformed.
  - name: "Malformed entries"
    question:
      content: text
      lines:
        - [0, "a"]
        - [0, "b"]
    examples:
      - response: [[0, "a", "extra"]]
        score: malformed
      - response: [["not-an-int", "a"]]
        score: malformed
      - response: [[0, 123]]
        score: malformed
