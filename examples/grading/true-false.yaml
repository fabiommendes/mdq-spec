# Document structure
#
# Question {
#   name: string
#   grading: "symmetric" | "partial" | "no-mistakes" | "all-or-nothing"
#
#   // Mapping of scores
#   choices: { [key of string]: boolean }
#
#   // Mapping of examples to their scores
#   examples: { marks: { [key of string]: boolean | null | string | number }, score: number | Fraction | "malformed" }[]
# }
#
# Some scores are represented as fractions because the floating point
# representation would be inexact. A statement with no marking is an
# abstention, written either as an absent key or as an explicit `null`. A
# value that is neither a boolean nor `null` makes the response malformed
# (responses.md, "True/false"): the score is "malformed".
questions:
  # The table in true-false.md, "Grading": answer key [T, F, T, F].
  - name: "Spec table"
    choices: { a: true, b: false, c: true, d: false }
    grading: "partial"
    examples:
      - marks: { a: true, b: false, c: true, d: false }
        score: 1.0
      - marks: { a: false, b: true, c: false, d: true }
        score: 0.0
      - marks: { a: true, b: true, c: false, d: false }
        score: 0.5
      - marks: { a: true, b: false }
        score: 0.5
      - marks: { a: false, b: true }
        score: 0.0
      - marks: {}
        score: 0.0
  - name: "Spec table"
    choices: { a: true, b: false, c: true, d: false }
    grading: "no-mistakes"
    examples:
      - marks: { a: true, b: false, c: true, d: false }
        score: 1.0
      - marks: { a: false, b: true, c: false, d: true }
        score: 0.0
      - marks: { a: true, b: true, c: false, d: false }
        score: 0.0
      - marks: { a: true, b: false }
        score: 0.5
      - marks: { a: false, b: true }
        score: 0.0
      - marks: {}
        score: 0.0
  - name: "Spec table"
    choices: { a: true, b: false, c: true, d: false }
    grading: "all-or-nothing"
    examples:
      - marks: { a: true, b: false, c: true, d: false }
        score: 1.0
      - marks: { a: false, b: true, c: false, d: true }
        score: 0.0
      - marks: { a: true, b: true, c: false, d: false }
        score: 0.0
      - marks: { a: true, b: false }
        score: 0.0
      - marks: { a: false, b: true }
        score: 0.0
      - marks: {}
        score: 0.0
  - name: "Spec table"
    choices: { a: true, b: false, c: true, d: false }
    grading: "symmetric"
    examples:
      - marks: { a: true, b: false, c: true, d: false }
        score: 1.0
      - marks: { a: false, b: true, c: false, d: true }
        score: -1.0
      - marks: { a: true, b: true, c: false, d: false }
        score: 0.0
      - marks: { a: true, b: false }
        score: 0.5
      - marks: { a: false, b: true }
        score: -0.5
      - marks: {}
        score: 0.0

  # An explicit `null` is the same abstention as an absent key.
  - name: "Explicit null"
    choices: { a: true, b: false, c: true, d: false }
    grading: "symmetric"
    examples:
      - marks: { a: true, b: false, c: null, d: null }
        score: 0.5
      - marks: { a: null, b: null, c: null, d: null }
        score: 0.0
  - name: "Explicit null"
    choices: { a: true, b: false, c: true, d: false }
    grading: "no-mistakes"
    examples:
      - marks: { a: true, b: null, c: null, d: null }
        score: 0.25
      - marks: { a: true, b: true, c: null, d: null }
        score: 0.0
  - name: "Explicit null"
    choices: { a: true, b: false, c: true, d: false }
    grading: "all-or-nothing"
    examples:
      - marks: { a: true, b: null, c: null, d: null }
        score: 0.0
      - marks: { a: true, b: false, c: true, d: false }
        score: 1.0

  # Three statements: scores that are not exact in binary floating point.
  - name: "Three statements"
    choices: { a: true, b: true, c: false }
    grading: "partial"
    examples:
      - marks: { a: true }
        score: "1/3"
      - marks: { a: true, b: true }
        score: "2/3"
  - name: "Three statements"
    choices: { a: true, b: true, c: false }
    grading: "symmetric"
    examples:
      - marks: { a: true, c: true }
        score: 0.0
      - marks: { a: false, b: false, c: true }
        score: -1.0
  - name: "Three statements"
    choices: { a: true, b: true, c: false }
    grading: "all-or-nothing"
    examples:
      - marks: { a: true, b: true, c: false }
        score: 1.0
      - marks: { a: true, b: true }
        score: 0.0
      - marks: { a: null, b: null, c: null }
        score: 0.0

  # A value that is neither a boolean nor `null` is a malformed response.
  - name: "Malformed value"
    choices: { a: true, b: false, c: true, d: false }
    grading: "symmetric"
    examples:
      - marks: { a: "T", b: false, c: true, d: false }
        score: "malformed"
      - marks: { a: 1, b: false, c: true, d: false }
        score: "malformed"

  # A key that names no statement of the question is a malformed response,
  # never ignored.
  - name: "Unknown statement id"
    choices: { a: true, b: false, c: true, d: false }
    grading: "symmetric"
    examples:
      - marks: { a: true, b: false, c: true, d: false, e: true }
        score: "malformed"
