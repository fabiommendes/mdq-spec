# Document structure
#
# Question {
#   name: string
#   grading: "symmetric" | "all-or-nothing" | "partial"
#
#   // Mapping of scores
#   choices: { [key of string]: boolean }
#
#   // Mapping of examples to their scores
#   examples: { marks: { [key of string]: boolean | null }, score: number | Fraction }[]
# }
#
# Some scores are represented as fractions because the floating point
# representation would be inexact. If a choice has no markings, it is implicitly null.
questions:
  # Symmetric grading
  - name: "Single correct choice"
    choices: { a: true, b: false, c: false, d: false }
    grading: "symmetric"
    examples:
      - mark: { a: true, b: false, c: false, d: false }
        score: 1.0
      - marks: {}
        score: 0.0

  # Partial grading
  - name: "Single correct choice"
    choices: { a: true, b: false, c: false, d: false }
    grading: "partial"
    examples:
      - mark: { a: true, b: false, c: false, d: false }
        score: 1.0
      - marks: {}
        score: 0.0

  # All-or-nothing grading
  - name: "Single correct choice"
    choices: { a: true, b: false, c: false, d: false }
    grading: "all-or-nothing"
    examples:
      - mark: { a: true, b: false, c: false, d: false }
        score: 1.0
      - marks: {}
        score: 0.0
