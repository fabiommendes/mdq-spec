# Document structure
#
# Question {
#   name: string
#
#   // The question's own fields, as in its YAML form: `answer`, and any
#   // of `tolerance`, `domain`, `decimalPlaces`, `unit`, `incorrectFeedback`.
#   question: { answer: number | string, ... }
#
#   // Responses and what they score (numeric.md, "Grading"). A response is
#   // a number, a string that spells an exact decimal or fraction, or a
#   // `{ value, unit }` mapping whose `value` is one of those and whose
#   // `unit` is optional (responses.md, "Numeric"). "malformed" is a value
#   // the question cannot represent: it is rejected, never scored
#   // (responses.md, "Errors"). `.inf` and `.nan` are the YAML non-finite
#   // numbers.
#   examples: {
#     response: number | string | { value: number | string, unit?: string },
#     score: 0 | 1 | "malformed",
#     feedback?: string | null
#   }[]
#
#   // `feedback` is the feedback string the response shows (numeric.md,
#   // "Feedback"), or null when it shows none. Only an incorrect response
#   // shows the `incorrectFeedback` of the question; a correct response
#   // shows none. A malformed response is rejected, so it has no feedback.
#   // When the key is absent, the vector does not check the feedback.
# }
questions:
  # No tolerance: the match is exact.
  - name: "Exact integer"
    question: { answer: 1822 }
    examples:
      - response: 1822
        score: 1
      - response: "1822"
        score: 1
      - response: 1821
        score: 0
      - response: 1822.5
        score: "malformed"
      - response: "1/2"
        score: "malformed"

  # Absolute tolerance: |answer - response| <= absolute.
  - name: "Absolute tolerance"
    question: { answer: 8849, tolerance: { absolute: 50 } }
    examples:
      - response: 8849
        score: 1
      - response: 8899
        score: 1
      - response: 8799
        score: 1
      - response: 8900
        score: 0
      - response: 8798
        score: 0

  # Relative tolerance: |answer - response| <= |answer| * relative.
  - name: "Relative tolerance"
    question: { answer: 200, tolerance: { relative: 0.05 } }
    examples:
      - response: 210
        score: 1
      - response: 190
        score: 1
      - response: 211
        score: 0
      - response: 189
        score: 0

  # `1000 +- 0.7%` is `relative: 0.007` (exact decimal division of the
  # spelling), so 1007 is on the boundary and is accepted.
  - name: "Relative tolerance written as a percentage"
    question: { answer: 1000, tolerance: { relative: 0.007 } }
    examples:
      - response: 1007
        score: 1
      - response: 993
        score: 1
      - response: 1008
        score: 0

  # Both tolerances: passing either one is enough.
  - name: "Either tolerance"
    question: { answer: 1000, tolerance: { absolute: 1, relative: 0.1 } }
    examples:
      - response: 1001
        score: 1
      - response: 1100
        score: 1
      - response: 1101
        score: 0

  # Decimal domain: the response and the answer are rounded to
  # `decimalPlaces`, half away from zero, before the tolerance test.
  # Inferred from `3.14 +- 0.01`: two places.
  - name: "Rounding to inferred decimal places"
    question: { answer: 3.14, tolerance: { absolute: 0.01 } }
    examples:
      - response: 3.14159
        score: 1
      - response: 3.149
        score: 1
      - response: 3.155
        score: 0
      - response: 3.154
        score: 1
      - response: "3.1415"
        score: 1

  # Explicit `decimalPlaces`; rounding is decimal, never binary floating
  # point, so 2.675 rounds to 2.68.
  - name: "Explicit decimal places"
    question: { answer: 2.68, decimalPlaces: 2 }
    examples:
      - response: 2.675
        score: 1
      - response: 2.6849
        score: 1
      - response: 2.685
        score: 0
      - response: 2.67
        score: 0

  # Fraction domain: a string response is an exact rational, which no float
  # can represent.
  - name: "Fraction"
    question: { answer: "1/3" }
    examples:
      - response: "1/3"
        score: 1
      - response: "2/6"
        score: 1
      - response: 0.3333
        score: 0
      - response: "0.5"
        score: 0

  # A fraction with an absolute tolerance written as a decimal is a decimal
  # question with two inferred places: the answer rounds to 0.33 first.
  - name: "Fraction with tolerance"
    question: { answer: "1/3", tolerance: { absolute: 0.01 } }
    examples:
      - response: 0.33
        score: 1
      - response: 0.34
        score: 1
      - response: 0.32
        score: 1
      - response: 0.31
        score: 0

  # A fraction answer under a declared `decimal` domain: the answer is exact
  # and `decimalPlaces` rounds it to 0.33. The response rounds to 2 places
  # too, so 0.333 matches and 0.34 does not.
  - name: "Fraction with declared decimal places"
    question: { answer: "1/3", domain: decimal, decimalPlaces: 2 }
    examples:
      - response: 0.33
        score: 1
      - response: 0.333
        score: 1
      - response: 0.3349
        score: 1
      - response: 0.34
        score: 0
      - response: 0.3
        score: 0

  # Negative answer: the relative tolerance uses |answer|.
  - name: "Negative answer"
    question: { answer: -40, tolerance: { relative: 0.1 } }
    examples:
      - response: -40
        score: 1
      - response: -44
        score: 1
      - response: -36
        score: 1
      - response: -45
        score: 0
      - response: 40
        score: 0

  # Zero answer: a relative tolerance gives no room, the absolute one does.
  - name: "Zero answer"
    question: { answer: 0, tolerance: { relative: 0.1 } }
    examples:
      - response: 0
        score: 1
      - response: 0.1
        score: "malformed"
      - response: 1
        score: 0
  # `0 +- 0.5` is a decimal question with one inferred place, so 0.51
  # rounds to 0.5 before the test and 0.56 rounds to 0.6.
  - name: "Zero answer with absolute tolerance"
    question: { answer: 0, tolerance: { absolute: 0.5 } }
    examples:
      - response: 0.5
        score: 1
      - response: 0.51
        score: 1
      - response: 0.56
        score: 0

  # The declared domain decides what the question can represent, even when
  # the value is written as an integer. A decimal question whose value is
  # written with no decimals infers zero places: the response rounds to a
  # whole number, half away from zero.
  - name: "Declared decimal domain"
    question: { answer: 5, domain: decimal }
    examples:
      - response: 5.0
        score: 1
      - response: 5.4
        score: 1
      - response: 5.5
        score: 0
  - name: "Declared integer domain"
    question: { answer: 5, domain: integer, tolerance: { absolute: 1 } }
    examples:
      - response: 6
        score: 1
      - response: 5.5
        score: "malformed"

  # The tolerance test is exact: |3.14 - 3.24| is exactly 0.1, although
  # the doubles give 0.10000000000000009. Inferred: two places.
  - name: "Float on the edge of the tolerance"
    question: { answer: 3.14, tolerance: { absolute: 0.1 } }
    examples:
      - response: 3.24
        score: 1
      - response: 3.04
        score: 1
      - response: "3.24"
        score: 1
      - response: 3.25
        score: 0
      - response: 3.03
        score: 0

  # The relative tolerance uses the answer before the rounding, so 0.4
  # (which rounds to 0) still gives a tolerance of 0.4 * 3 = 1.2.
  - name: "Relative tolerance with an answer that rounds to zero"
    question: { answer: 0.4, decimalPlaces: 0, tolerance: { relative: 3 } }
    examples:
      - response: 0.3
        score: 1
      - response: 1
        score: 1
      - response: 2
        score: 0

  # The unrounded answer 0.9 gives a tolerance of 0.9, not 1 (the
  # rounded answer). Both 0 and 2 are one unit away from the rounded answer.
  - name: "Relative tolerance with an answer that rounds up"
    question: { answer: 0.9, decimalPlaces: 0, tolerance: { relative: 1 } }
    examples:
      - response: 1
        score: 1
      - response: 0
        score: 0
      - response: 2
        score: 0

  # The tolerance is not rounded: 0.06 stays 0.06, it does not become 0.1.
  # The distance between rounded values is 0.1.
  - name: "Tolerance is not rounded"
    question: { answer: "3.0", decimalPlaces: 1, tolerance: { absolute: 0.06 } }
    examples:
      - response: 3.04
        score: 1
      - response: 3.1
        score: 0

  # A YAML float of whole value is an integer, because JS cannot tell
  # `4.0` from `4`: the domain is inferred as integer, with 0 places.
  - name: "Whole YAML float is an integer"
    question: { answer: 4.0 }
    examples:
      - response: 4
        score: 1
      - response: "4.0"
        score: 1
      - response: 5
        score: 0
      - response: 4.5
        score: "malformed"

  # The absolute tolerance is read the same way: `1.0` is an integer.
  - name: "Whole YAML float tolerance is an integer"
    question: { answer: 8, tolerance: { absolute: 1.0 } }
    examples:
      - response: 9
        score: 1
      - response: 10
        score: 0
      - response: 8.5
        score: "malformed"

  # A whole float counts 0 places, so a declared decimal domain rounds to
  # whole numbers: 4.4 rounds to 4, 4.5 rounds to 5.
  - name: "Declared decimal domain with a whole YAML float"
    question: { answer: 4.0, domain: decimal }
    examples:
      - response: 4.4
        score: 1
      - response: 4.5
        score: 0

  # A string answer is read by its digits: "4.0" is a decimal with one
  # place, so 4.04 rounds to 4.0 and 4.05 rounds to 4.1.
  - name: "Decimal string answer"
    question: { answer: "4.0" }
    examples:
      - response: 4.04
        score: 1
      - response: 4.05
        score: 0
      - response: 4
        score: 1

  # Responses of an integer question (responses.md, "Numeric"). Integer
  # judges the value: 5.0, "5.0" and "10/2" are whole.
  - name: "Responses of an integer question"
    question: { answer: 5 }
    examples:
      - response: 5
        score: 1
      - response: "5"
        score: 1
      - response: 5.0
        score: 1
      - response: "5.0"
        score: 1
      - response: "10/2"
        score: 1
      - response: 6
        score: 0
      - response: 5.5
        score: "malformed"
      - response: "5.5"
        score: "malformed"
      - response: "1/3"
        score: "malformed"
      - response: .inf
        score: "malformed"
      - response: -.inf
        score: "malformed"
      - response: .nan
        score: "malformed"

  # Responses of a fraction question: a decimal is valid, and scored.
  - name: "Responses of a fraction question, whole answer"
    question: { answer: 5, domain: fraction }
    examples:
      - response: 5
        score: 1
      - response: "5"
        score: 1
      - response: 5.0
        score: 1
      - response: "5.0"
        score: 1
      - response: 5.5
        score: 0
      - response: "5.5"
        score: 0
      - response: "1/3"
        score: 0
      - response: .inf
        score: "malformed"
      - response: .nan
        score: "malformed"

  - name: "Responses of a fraction question, fraction answer"
    question: { answer: "11/2" }
    examples:
      - response: "11/2"
        score: 1
      - response: 5.5
        score: 1
      - response: "5.5"
        score: 1
      - response: "22/4"
        score: 1
      - response: 5
        score: 0
      - response: .inf
        score: "malformed"
      - response: .nan
        score: "malformed"

  # Responses of a decimal question: a fraction is malformed, even when
  # its value is a decimal ("11/2" is 5.5).
  - name: "Responses of a decimal question"
    question: { answer: "5.5", tolerance: { absolute: 0.5 } }
    examples:
      - response: 5
        score: 1
      - response: "5"
        score: 1
      - response: 5.0
        score: 1
      - response: "5.0"
        score: 1
      - response: 5.5
        score: 1
      - response: "5.5"
        score: 1
      - response: 7
        score: 0
      - response: "11/2"
        score: "malformed"
      - response: "1/3"
        score: "malformed"
      - response: .inf
        score: "malformed"
      - response: .nan
        score: "malformed"

  # The string of a response is exactly `sign? value`: not trimmed, no
  # comma, no inner space. A `number` MAY have an exponent, as a JSON number
  # does: "1e3" and 1.0e+3 are 1000. A fraction takes none.
  - name: "Response string grammar"
    question: { answer: 1000 }
    examples:
      - response: "+1000"
        score: 1
      - response: 1.0e+3
        score: 1
      - response: "1e3"
        score: 1
      - response: "1E3"
        score: 1
      - response: "1e+3"
        score: 1
      - response: "1e03"
        score: 1
      - response: "10e2"
        score: 1
      - response: "1e"
        score: "malformed"
      - response: "e3"
        score: "malformed"
      - response: "1e3.5"
        score: "malformed"
      - response: "1e3/2"
        score: "malformed"
      - response: "1,000"
        score: "malformed"
      - response: "1 000"
        score: "malformed"
      - response: " 1000"
        score: "malformed"
      - response: "1000 "
        score: "malformed"
      - response: "1000."
        score: "malformed"
      - response: ""
        score: "malformed"
      - response: "abc"
        score: "malformed"
      - response: "1000/0"
        score: "malformed"

  # Units (responses.md, "Numeric"): the unit of a response is the declared
  # one or absent. Another unit is malformed, whatever the value.
  - name: "Units"
    question: { answer: 1000, unit: g }
    examples:
      - response: { value: 1000, unit: g }
        score: 1
      - response: { value: 1000 }
        score: 1
      - response: 1000
        score: 1
      - response: { value: "1000", unit: g }
        score: 1
      - response: { value: 999, unit: g }
        score: 0
      - response: { value: 1, unit: kg }
        score: "malformed"
      - response: { value: 1000, unit: kg }
        score: "malformed"
      - response: { value: 1000, unit: G }
        score: "malformed"
      - response: { unit: g }
        score: "malformed"

  # The units are equal after NFC: "Å" is U+00C5 in the question and
  # "A" + U+030A in the response. Written with YAML escapes.
  - name: "Units equal after NFC"
    question: { answer: 5000, unit: "\u00c5" }
    examples:
      - response: { value: 5000, unit: "A\u030a" }
        score: 1
      - response: { value: 5000, unit: "\u00c5" }
        score: 1
      - response: { value: 5000, unit: "A" }
        score: "malformed"

  # A question with no unit takes no unit in the response.
  - name: "Unit on a question without unit"
    question: { answer: 1000 }
    examples:
      - response: { value: 1000 }
        score: 1
      - response: { value: 1000, unit: g }
        score: "malformed"

  # `incorrectFeedback` is shown for an incorrect response only. A response
  # inside the tolerance is correct and shows none. A malformed response is
  # rejected before it is scored.
  - name: "Incorrect feedback"
    question:
      answer: 2995
      unit: m
      tolerance: { absolute: 5 }
      incorrectFeedback: "Not quite. The Pico da Neblina is in the Serra do Imeri."
    examples:
      - response: 2995
        score: 1
        feedback: null
      - response: 3000
        score: 1
        feedback: null
      - response: 3001
        score: 0
        feedback: "Not quite. The Pico da Neblina is in the Serra do Imeri."
      - response: { value: 2000, unit: m }
        score: 0
        feedback: "Not quite. The Pico da Neblina is in the Serra do Imeri."
      - response: "abc"
        score: "malformed"
      - response: 2999.5
        score: "malformed"

  # Without `incorrectFeedback`, an incorrect response shows no feedback.
  - name: "No incorrect feedback declared"
    question: { answer: 2995, tolerance: { absolute: 5 } }
    examples:
      - response: 3001
        score: 0
        feedback: null

  # Scientific notation (numeric.md, "Body"): the answer, the response and the
  # absolute tolerance take an exponent, as a string or as a number. The
  # answer 6.022e23 is exact: 6022 * 10^20.
  - name: "Exponent in the response"
    question: { answer: "6.022e23", unit: "1/mol" }
    examples:
      - response: "6.022e23"
        score: 1
      - response: 6.022e+23
        score: 1
      - response: "602200000000000000000000"
        score: 1
      - response: "6.0220e23"
        score: 1
      - response: { value: "6.022E+23", unit: "1/mol" }
        score: 1
      - response: "6.023e23"
        score: 0
      - response: "6.022e22"
        score: 0
      - response: "6,022e23"
        score: "malformed"

  # The absolute tolerance takes an exponent: 0.001e23 is 1e20, so the
  # response 6.023e23 (a distance of exactly 1e20) is on the edge, inside.
  - name: "Exponent in the absolute tolerance"
    question: { answer: 6.022e+23, tolerance: { absolute: 1.0e+20 }, domain: decimal }
    examples:
      - response: "6.023e23"
        score: 1
      - response: "6.021e23"
        score: 1
      - response: "6.0231e23"
        score: 0
      - response: "6.0209e23"
        score: 0

  # A relative tolerance on a value with an exponent: 5.972e24 * 0.01 =
  # 5.972e22, so the edges are 5.91228e24 and 6.03172e24, both inside.
  - name: "Exponent in the answer, relative tolerance"
    question: { answer: "5.972e24", tolerance: { relative: 0.01 }, unit: kg }
    examples:
      - response: "6.03172e24"
        score: 1
      - response: "6.031721e24"
        score: 0
      - response: "5.91228e24"
        score: 1
      - response: "5.912279e24"
        score: 0

  # A negative exponent adds decimal places: the answer has 2 + 7 = 9 places,
  # and the comparison rounds to them. 5.8949e-7 rounds to 0.000000589, which is
  # the answer. 5.895e-7 rounds half away from zero to 0.000000590.
  - name: "Exponent adds decimal places"
    question: { answer: "5.89e-7" }
    examples:
      - response: "5.89e-7"
        score: 1
      - response: "5.8949e-7"
        score: 1
      - response: "5.895e-7"
        score: 0
      - response: 5.89e-07
        score: 1
      - response: "0.000000589"
        score: 1

  # An integer question judges a response by its value: "1e3" is whole, so it
  # is valid, and "1e-3" is not whole, so it is malformed.
  - name: "Exponent in an integer question"
    question: { answer: 1000, domain: integer }
    examples:
      - response: "1e3"
        score: 1
      - response: 1.0e+3
        score: 1
      - response: "1e-3"
        score: "malformed"
      - response: "1.5e3"
        score: 0
      - response: "1.0005e3"
        score: "malformed"

  # A value outside the range of a double is malformed, as the runtimes read
  # a number as a double before the exact arithmetic: a modulus above the
  # largest finite double (about 1.797e308), or a value that is not zero but
  # rounds to 0 (numeric.md, "Answer representation"). The exponent has at
  # most 3 digits. The smallest positive double is about 4.9e-324.
  - name: "Range of a double"
    question: { answer: 1.7e+308, domain: decimal }
    examples:
      - response: "1.7e308"
        score: 1
      - response: "1.7e+308"
        score: 1
      - response: "1.8e308"
        score: "malformed"
      - response: "1e400"
        score: "malformed"
      - response: "-1e400"
        score: "malformed"
      - response: "1e1000"
        score: "malformed"
      - response: "1e-400"
        score: "malformed"
      - response: "1e-1000"
        score: "malformed"
      - response: "5e-324"
        score: 0
      - response: "1e-323"
        score: 0
      - response: "0e400"
        score: 0
      - response: "0e-999"
        score: 0
