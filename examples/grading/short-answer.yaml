# Document structure
#
# Question {
#   name: string
#
#   // The question's own fields, as in its YAML form: any of `accept`,
#   // `reject`, `unmatched`, `diacritics`, `incorrectFeedback`.
#   question: { accept: Pattern[], reject: Pattern[], ... }
#
#   // Responses and what they score (short-answer.md, "Grading"). The score
#   // is binary. "pending" is a response the question does not settle: the
#   // instructor grades it (responses.md, "Pending").
#   //
#   // `response` is a string (responses.md, "Short answer and essay"). Any
#   // other value is a malformed response: the score is "malformed", and the
#   // question rejects it with a `ResponseError` instead of scoring it.
#   examples: { response: string | any, score: 0 | 1 | "pending" | "malformed", feedback?: string | null }[]
#
#   // `feedback` is the feedback string the response shows (short-answer.md,
#   // "Feedback"), or null when it shows none. A pending response shows
#   // none. When the key is absent, the vector does not check the feedback.
# }
questions:
  # One inexact literal (patterns.md, "Inexact literals"): case, diacritics,
  # whitespace and the ASCII/typographic quote and dash pairs are ignored.
  # No pattern matches "Rio de Janeiro", and the question has an `accept`,
  # so `unmatched` defaults to "incorrect".
  - name: "Inexact literal"
    question: { accept: ["Brasília"] }
    examples:
      - response: "Brasília"
        score: 1
      - response: "BRASILIA"
        score: 1
      - response: "  brasilia  "
        score: 1
      - response: "Bras ília"
        score: 0
      - response: "Rio de Janeiro"
        score: 0
      - response: ""
        score: 0

  - name: "Inexact literal with quote and dash"
    question: { accept: ["caixa d'água", "pau-brasil"] }
    examples:
      - response: "caixa d’água"
        score: 1
      - response: "pau–brasil"
        score: 1
      - response: "pau brasil"
        score: 0

  # `diacritics: keep` skips only the diacritics step: case folding and
  # whitespace normalization still apply.
  - name: "Diacritics kept"
    question: { accept: ["Maceió"], diacritics: keep }
    examples:
      - response: "maceió"
        score: 1
      - response: "Maceio"
        score: 0

  # A backtick literal is compared exactly (patterns.md, "Exact literals"):
  # only NFC and the whitespace at the ends are normalized.
  - name: "Exact literal"
    question: { accept: ["`math.isnan`"] }
    examples:
      - response: "math.isnan"
        score: 1
      - response: " math.isnan\n"
        score: 1
      - response: "Math.isnan"
        score: 0
      - response: "math . isnan"
        score: 0

  # The exact literal follows the CommonMark code span (patterns.md, "Exact
  # literals"): N backticks open it, a run of exactly N backticks closes it,
  # and one space is removed from each end when both ends have one.
  # `` `date` `` is the shell command substitution `date`.
  - name: "Exact literal with a backtick"
    question: { accept: ["`` `date` ``"] }
    examples:
      - response: "`date`"
        score: 1
      - response: " `date`\n"
        score: 1
      - response: "date"
        score: 0
      - response: "`` `date` ``"
        score: 0

  # A longer fence holds a shorter run of backticks.
  - name: "Exact literal with a run of backticks"
    question: { accept: ["```a``b```", "`a`` b`"] }
    examples:
      - response: "a``b"
        score: 1
      - response: "a`` b"
        score: 1
      - response: "a`b"
        score: 0

  # The two spaces that fence a lone backtick are not part of the literal.
  - name: "Exact literal of one backtick"
    question: { accept: ["`` ` ``"] }
    examples:
      - response: "`"
        score: 1
      - response: " ` "
        score: 1
      - response: "``"
        score: 0

  # Spaces and tabs at both ends of a pattern string are removed before the
  # pattern is classified (patterns.md, "Pattern string"), so each pattern
  # below keeps its kind: exact literal, regex or inexact literal.
  - name: "Spaces and tabs around a pattern string"
    question: { accept: ["  `Manaus`", "\t`Belém`  ", "  /porto velho/i", "  Brasília ", "`Macapá`  "] }
    examples:
      - response: "Manaus"
        score: 1
      - response: "manaus"
        score: 0
      - response: "Belém"
        score: 1
      - response: "belém"
        score: 0
      - response: "PORTO VELHO"
        score: 1
      - response: "brasilia"
        score: 1
      - response: "Macapá"
        score: 1
      - response: "macapá"
        score: 0

  # A regex is anchored to the whole response; `i` folds case and `n`
  # strips diacritics (patterns.md, "Regex flags").
  - name: "Regex"
    question: { accept: ["/1822-0?9-0?7/"] }
    examples:
      - response: "1822-09-07"
        score: 1
      - response: "1822-9-7"
        score: 1
      - response: "em 1822-09-07"
        score: 0
  # Before a regex matches, the response is normalized to NFC and the
  # `UNICODE_SPACE` code points are removed from both ends, as for an exact
  # literal (patterns.md, "Regex"). Interior spaces are untouched.
  - name: "Regex response preparation"
    question: { accept: ["/1822-0?9-0?7/", "/Brasília/"] }
    examples:
      - response: "1822-09-07 "
        score: 1
      - response: "1822-09-07\n"
        score: 1
      - response: " 1822-09-07"
        score: 1
      - response: "Brasi\u0301lia"
        score: 1
      - response: "1822 -09-07"
        score: 0
  - name: "Regex with the f flag and interior spaces"
    question: { accept: ["/Brasília/f"] }
    examples:
      - response: "a capital é Brasília, ao centro"
        score: 1
      - response: " Brasília "
        score: 1
      - response: "Bras ília"
        score: 0
  # Regexes run in code point mode, and the shorthand classes are explicit
  # (patterns.md, "Regex"): `\d` is `[0-9]`, `\w` is `[A-Za-z0-9_]` and `\s`
  # is `UNICODE_SPACE`, which has no U+FEFF. U+FEFF inside a response is not
  # trimmed, because trimming only reaches the ends.
  - name: "Regex dot matches one code point"
    question: { accept: ["/./"] }
    examples:
      - response: "\U0001F600"
        score: 1
  - name: "Regex braced Unicode escape"
    question: { accept: ["/\\u{1F600}/"] }
    examples:
      - response: "\U0001F600"
        score: 1
  - name: "Regex i folds long s"
    question: { accept: ["/s/i"] }
    examples:
      - response: "\u017F"
        score: 1
  - name: "Regex i folds Kelvin sign"
    question: { accept: ["/k/i"] }
    examples:
      - response: "\u212A"
        score: 1
  - name: "Regex digit is ASCII"
    question: { accept: ["/\\d/"] }
    examples:
      - response: "\u0663"
        score: 0
  - name: "Regex word is ASCII"
    question: { accept: ["/\\w+/"] }
    examples:
      - response: "José"
        score: 0
  - name: "Regex word with the n flag"
    question: { accept: ["/\\w+/n"] }
    examples:
      - response: "José"
        score: 1
  - name: "Regex space"
    question: { accept: ["/a\\sb/"] }
    examples:
      - response: "a\u00A0b"
        score: 1
      - response: "a\uFEFFb"
        score: 0

  # `n` strips the response and the literal characters of the body.
  - name: "Regex n strips literal diacritics"
    question: { accept: ["/água/n"] }
    examples:
      - response: "agua"
        score: 1
      - response: "água"
        score: 1

  # An escape is the exact code point: `n` never strips it, so it cannot
  # match the stripped response (lint `unmatchable-regex-escape`).
  - name: "Regex n keeps escapes"
    question: { accept: ["/\\u00e1gua/n"] }
    examples:
      - response: "água"
        score: 0
      - response: "agua"
        score: 0

  - name: "Regex with flags"
    question: { accept: ["/cerrado/in"] }
    examples:
      - response: "Cerrado"
        score: 1
      - response: "CERRÁDO"
        score: 1
      - response: "o cerrado"
        score: 0
  - name: "Regex without the flags"
    question: { accept: ["/cerrado/"] }
    examples:
      - response: "cerrado"
        score: 1
      - response: "Cerrado"
        score: 0

  # The last `/` closes the regex, so an unescaped `/` is part of the body
  # (patterns.md, "Regular expressions"). The spaces after the flags are
  # removed.
  - name: "Regex with an unescaped slash"
    question: { accept: ["/gov\\.br/a/i "] }
    examples:
      - response: "GOV.BR/A"
        score: 1
      - response: "gov.br"
        score: 0

  # `.` is any code point except LF, CR, U+2028 and U+2029 (patterns.md,
  # "Code point mode"). U+0085 is not a line terminator there, so it matches.
  - name: "Dot and the line terminators"
    question: { accept: ["/rio.negro/"] }
    examples:
      - response: "rio negro"
        score: 1
      - response: "rio\u0085negro"
        score: 1
      - response: "rio\u000bnegro"
        score: 1
      - response: "rio\nnegro"
        score: 0
      - response: "rio\rnegro"
        score: 0
      - response: "rio\u2028negro"
        score: 0
      - response: "rio\u2029negro"
        score: 0

  # A negated class matches every code point outside it, line terminators
  # included.
  - name: "Negated class and the line terminators"
    question: { accept: ["/rio[^a]negro/"] }
    examples:
      - response: "rio\nnegro"
        score: 1
      - response: "rioanegro"
        score: 0

  # The `n` flag removes the code points of the `nonspacing` table of the
  # pinned Unicode version, not the ones of the runtime (patterns.md, "Regex
  # flags"). U+0301 is in the table, and so is U+10EF0 (ARABIC SMALL LOW UPRIGHT
  # RECTANGULAR ZERO, assigned after Unicode 15.1), which a runtime on an older
  # Unicode version does not know.
  - name: "The n flag removes nonspacing marks"
    question: { accept: ["/tupi./n"] }
    examples:
      - response: "tupi\u0301a"
        score: 1
      - response: "tupi\U00010EF0a"
        score: 1
      - response: "tupia"
        score: 1
      - response: "tupi\u0301ab"
        score: 0

  # The three rules apply in order: `accept` first, then `reject`, then
  # `unmatched`. `reject` only attaches feedback to known wrong answers; it
  # does not change what happens to the other responses.
  - name: "Accept and reject"
    question:
      accept: ["Brasília"]
      reject:
        - pattern: "Rio de Janeiro"
          feedback: "It was the capital until 1960."
    examples:
      - response: "brasília"
        score: 1
      - response: "rio de janeiro"
        score: 0
      - response: "Salvador"
        score: 0
  - name: "Accept wins over reject"
    question: { accept: ["/cerrad[oa]/i"], reject: ["Cerrado"] }
    examples:
      - response: "Cerrado"
        score: 1
      - response: "cerrada"
        score: 1

  # `unmatched: manual`: a response that matches no pattern is pending.
  - name: "Semi-automatic"
    question:
      accept: ["Cerrado", "Pantanal"]
      reject: ["Savana"]
      unmatched: manual
    examples:
      - response: "Cerrado"
        score: 1
      - response: "savana"
        score: 0
      - response: "Mata Atlântica"
        score: "pending"

  # No `accept`: `unmatched` defaults to "manual". A rejected response is
  # still settled.
  - name: "Reject only"
    question: { reject: ["Savana"] }
    examples:
      - response: "Savana"
        score: 0
      - response: "Cerrado"
        score: "pending"

  # `unmatched: incorrect` without `accept`: every response is settled, and
  # none is correct.
  - name: "Reject only, automatic"
    question: { reject: ["Savana"], unmatched: incorrect }
    examples:
      - response: "Savana"
        score: 0
      - response: "Cerrado"
        score: 0

  # No pattern at all: a one-line essay.
  - name: "Manual"
    question: {}
    examples:
      - response: "Cerrado"
        score: "pending"
      - response: ""
        score: "pending"

  # Feedback (short-answer.md, "Feedback"). The first pattern that matches
  # AND has feedback gives it, in the list that decided the outcome: an
  # earlier match with no feedback is passed over.
  - name: "Feedback of the first matching pattern with feedback"
    question:
      accept:
        - "/cerrad[oa]/i"
        - { pattern: "Cerrado", feedback: "Right: the Cerrado is a savanna." }
      reject:
        - { pattern: "Savana", feedback: "Savanna is the general term." }
    examples:
      - response: "Cerrado"
        score: 1
        feedback: "Right: the Cerrado is a savanna."
      - response: "cerrada"
        score: 1
        feedback: null
      - response: "Savana"
        score: 0
        feedback: "Savanna is the general term."

  # A response that matches `accept` and `reject` is correct, and takes the
  # feedback of `accept`, not the one of `reject`.
  - name: "Feedback of accept when reject also matches"
    question:
      accept:
        - { pattern: "Brasília", feedback: "Right." }
      reject:
        - { pattern: "/bras.*/i", feedback: "Check the spelling." }
    examples:
      - response: "Brasília"
        score: 1
        feedback: "Right."
      - response: "Brasil"
        score: 0
        feedback: "Check the spelling."

  # The feedback comes from the list that decided the outcome only. A correct
  # response whose `accept` pattern has no feedback shows none, even when a
  # `reject` pattern that matches it has feedback.
  - name: "Feedback of reject never reaches a correct response"
    question:
      accept: ["Cerrado"]
      reject:
        - { pattern: "/.*rrad.*/", feedback: "Check the spelling: Cerrado has two r." }
    examples:
      - response: "Cerrado"
        score: 1
        feedback: null
      - response: "Serrado"
        score: 0
        feedback: "Check the spelling: Cerrado has two r."

  # `incorrectFeedback` is for an incorrect response that no pattern gave
  # feedback to: one that matches no pattern, and one that matches a
  # `reject` pattern with no feedback. A correct response never shows it.
  - name: "incorrectFeedback"
    question:
      accept: ["Brasília"]
      reject:
        - "Rio de Janeiro"
        - { pattern: "Salvador", feedback: "It was the capital until 1763." }
      incorrectFeedback: "That city was never the capital."
    examples:
      - response: "Brasília"
        score: 1
        feedback: null
      - response: "Manaus"
        score: 0
        feedback: "That city was never the capital."
      - response: "Rio de Janeiro"
        score: 0
        feedback: "That city was never the capital."
      - response: "Salvador"
        score: 0
        feedback: "It was the capital until 1763."

  # A response the question does not settle shows no feedback, even with an
  # `incorrectFeedback`.
  - name: "No feedback for a pending response"
    question:
      accept: ["Cerrado"]
      reject: [{ pattern: "Savana", feedback: "Savanna is the general term." }]
      unmatched: manual
      incorrectFeedback: "Try again."
    examples:
      - response: "Mata Atlântica"
        score: "pending"
        feedback: null
      - response: "Savana"
        score: 0
        feedback: "Savanna is the general term."

  # The response is a string (responses.md, "Short answer and essay"). An
  # empty string, or one of only spaces, is not a skip (only `null` is): it
  # is graded like any other response.
  - name: "Empty response, unmatched incorrect"
    question: { accept: ["Brasília"] }
    examples:
      - response: ""
        score: 0
      - response: "   "
        score: 0

  - name: "Empty response, unmatched manual"
    question: { accept: ["Brasília"], unmatched: manual }
    examples:
      - response: ""
        score: "pending"
      - response: "   "
        score: "pending"

  # A regex that matches the empty string accepts an empty response. The
  # spaces at the ends are removed before it matches (patterns.md, "Regex
  # subject").
  - name: "Empty response accepted by a regex"
    question: { accept: ["/.*/"] }
    examples:
      - response: ""
        score: 1
      - response: "   "
        score: 1

  # A response can hold line breaks. An inexact literal collapses them to
  # one space.
  - name: "Response with a line break"
    question: { accept: ["Rio Negro"] }
    examples:
      - response: "Rio\nNegro"
        score: 1
      - response: "Rio\r\n\r\nNegro"
        score: 1

  # A value that is not a string is a malformed response, never converted:
  # `1960` and `1960.0` would become different texts.
  - name: "Malformed response"
    question: { accept: ["1960"] }
    examples:
      - response: 1960
        score: "malformed"
      - response: 1960.0
        score: "malformed"
      - response: ["1960"]
        score: "malformed"
      - response: { year: "1960" }
        score: "malformed"
      - response: true
        score: "malformed"

  # `null` is not a skip for a short answer question: it is a malformed
  # response, like any other value that is not a string.
  - name: "Null response"
    question: { accept: ["Brasília"] }
    examples:
      - response: null
        score: "malformed"

  # An empty response, or one of only spaces and line breaks, is graded like
  # any other response.
  - name: "Blank responses"
    question: { accept: ["Brasília"] }
    examples:
      - response: "   "
        score: 0
      - response: "\n"
        score: 0

  # With `unmatched: manual`, an empty response that matches no pattern is
  # pending.
  - name: "Blank responses with manual grading"
    question: { accept: ["Brasília"], unmatched: manual }
    examples:
      - response: ""
        score: "pending"
      - response: "   "
        score: "pending"

  # `unmatched: incorrect` without `accept` still gives the
  # `incorrectFeedback` to every response.
  - name: "incorrectFeedback with unmatched incorrect and no accept"
    question:
      unmatched: incorrect
      incorrectFeedback: "That city was never the capital."
    examples:
      - response: "Salvador"
        score: 0
        feedback: "That city was never the capital."

  # `*` has no special meaning (patterns.md): the exact literal `` `*` ``
  # matches only an asterisk, in `accept` and in `reject`.
  - name: "Asterisk exact literal in accept"
    question: { accept: ["`*`"] }
    examples:
      - response: "*"
        score: 1
      - response: " * "
        score: 1
      - response: "**"
        score: 0
      - response: "Brasília"
        score: 0
      - response: ""
        score: 0

  - name: "Asterisk exact literal in reject"
    question:
      accept: ["Brasília"]
      reject:
        - { pattern: "`*`", feedback: "Name the city." }
    examples:
      - response: "*"
        score: 0
        feedback: "Name the city."
      - response: "Salvador"
        score: 0
        feedback: null

  # An exact literal in `reject` compares like one in `accept`: NFC, trimmed,
  # code point for code point. Case and diacritics still differ.
  - name: "Exact literal in reject compares code point for code point"
    question:
      accept: ["Manaus"]
      reject:
        - { pattern: "`Brasília`", feedback: "Brasília is in the Cerrado." }
    examples:
      - response: "Brasília"
        score: 0
        feedback: "Brasília is in the Cerrado."
      - response: "  Brasília\n"
        score: 0
        feedback: "Brasília is in the Cerrado."
      - response: "Brasília"
        score: 0
        feedback: "Brasília is in the Cerrado."
      - response: "brasília"
        score: 0
        feedback: null
      - response: "Brasilia"
        score: 0
        feedback: null

  # Without the delimiters `/.../` a regex-shaped string is an inexact
  # literal, so the brackets are plain characters.
  - name: "Regex-shaped literal without delimiters"
    question: { accept: ["[Bb]rasilia"] }
    examples:
      - response: "[Bb]rasilia"
        score: 1
      - response: "Brasília"
        score: 0
      - response: "brasilia"
        score: 0

  # A pattern that contains a slash but does not start with one is a literal.
  - name: "Literal with a slash"
    question: { accept: ["math/floor"] }
    examples:
      - response: "math/floor"
        score: 1
      - response: "MATH/FLOOR"
        score: 1

  # A matching `reject` pattern with no feedback gives none, and the question
  # has no `incorrectFeedback`.
  - name: "Reject without feedback and without incorrectFeedback"
    question: { accept: ["Brasília"], reject: ["/Rio.*/"] }
    examples:
      - response: "Rio de Janeiro"
        score: 0
        feedback: null

  # `preAccept` and `preReject` only belong to pre-validation: a submission
  # that matches a `preReject` pattern is still graded by `accept`.
  - name: "Pre-validation lists do not change the score"
    question:
      accept: ["1822"]
      preAccept: ["/./f"]
      preReject: ["/1822/"]
    examples:
      - response: "1822"
        score: 1
      - response: "1823"
        score: 0

  # `diacritics: keep` also applies to the patterns of `reject`: the
  # unaccented response is not swallowed by `accept`, and the feedback of the
  # `reject` pattern shows.
  - name: "Reject feedback with diacritics kept"
    question:
      accept: ["Brasília"]
      diacritics: keep
      reject:
        - { pattern: "Brasilia", feedback: "You forgot the accent on the i." }
      incorrectFeedback: "Sorry, that is not correct."
    examples:
      - response: "Brasilia"
        score: 0
        feedback: "You forgot the accent on the i."
      - response: "Salvador"
        score: 0
        feedback: "Sorry, that is not correct."

  # The feedback comes from the first matching pattern that has one, and
  # whether a pattern matches depends on `diacritics`.
  - name: "Feedback with diacritics folded"
    question:
      accept:
        - { pattern: "Maceió", feedback: "Exact match." }
        - { pattern: "/Mac.*/i", feedback: "Fallback." }
    examples:
      - response: "Maceio"
        score: 1
        feedback: "Exact match."
  - name: "Feedback with diacritics kept"
    question:
      diacritics: keep
      accept:
        - { pattern: "Maceió", feedback: "Exact match." }
        - { pattern: "/Mac.*/i", feedback: "Fallback." }
    examples:
      - response: "Maceio"
        score: 1
        feedback: "Fallback."
      - response: "Maceió"
        score: 1
        feedback: "Exact match."

  # `keep` skips only the accent stripping, not the Unicode normalization: a
  # decomposed pattern matches the composed response.
  - name: "Decomposed pattern with diacritics kept"
    question: { accept: ["Brasília"], diacritics: keep }
    examples:
      - response: "Brasília"
        score: 1
      - response: "Brasilia"
        score: 0
