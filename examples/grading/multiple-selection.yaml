# Document structure
#
# Question {
#   name: string
#   grading: "symmetric" | "all-or-nothing" | "partial"
#
#   // Mapping of scores
#   choices: { [key of string]: boolean }
#
#   // Mapping of examples to their scores
#   examples: { ticks: (string | number)[], score: number | Fraction | "malformed" }[]
# }
#
# Some scores are represented as fractions because the floating point
# representation would be inexact. An unticked choice asserts false, so
# `ticks: []` is a full answer, not an abstention.
questions:
  # The table in multiple-selection.md, "Grading": answer key {a, c}.
  - name: "Spec table"
    choices: { a: true, b: false, c: true, d: false }
    grading: "partial"
    examples:
      - ticks: ["a", "c"]
        score: 1.0
      - ticks: ["b", "d"]
        score: 0.0
      - ticks: ["a", "b"]
        score: 0.5
      - ticks: ["a"]
        score: 0.75
      - ticks: ["b"]
        score: 0.25
      - ticks: []
        score: 0.5
  - name: "Spec table"
    choices: { a: true, b: false, c: true, d: false }
    grading: "all-or-nothing"
    examples:
      - ticks: ["a", "c"]
        score: 1.0
      - ticks: ["b", "d"]
        score: 0.0
      - ticks: ["a", "b"]
        score: 0.0
      - ticks: ["a"]
        score: 0.0
      - ticks: ["b"]
        score: 0.0
      - ticks: []
        score: 0.0
  - name: "Spec table"
    choices: { a: true, b: false, c: true, d: false }
    grading: "symmetric"
    examples:
      - ticks: ["a", "c"]
        score: 1.0
      - ticks: ["b", "d"]
        score: -1.0
      - ticks: ["a", "b"]
        score: 0.0
      - ticks: ["a"]
        score: 0.5
      - ticks: ["b"]
        score: -0.5
      - ticks: []
        score: 0.0

  # A single correct choice: ticking nothing still judges three of four
  # choices correctly.
  - name: "Single correct choice"
    choices: { a: true, b: false, c: false, d: false }
    grading: "partial"
    examples:
      - ticks: ["a"]
        score: 1.0
      - ticks: []
        score: 0.75
      - ticks: ["a", "b", "c", "d"]
        score: 0.25
  - name: "Single correct choice"
    choices: { a: true, b: false, c: false, d: false }
    grading: "all-or-nothing"
    examples:
      - ticks: ["a"]
        score: 1.0
      - ticks: []
        score: 0.0
  - name: "Single correct choice"
    choices: { a: true, b: false, c: false, d: false }
    grading: "symmetric"
    examples:
      - ticks: ["a"]
        score: 1.0
      - ticks: []
        score: 0.5
      - ticks: ["a", "b", "c", "d"]
        score: -0.5

  # Three choices: scores that are not exact in binary floating point.
  - name: "Three choices"
    choices: { a: true, b: true, c: false }
    grading: "partial"
    examples:
      - ticks: ["a"]
        score: "2/3"
      - ticks: ["c"]
        score: 0.0
  - name: "Three choices"
    choices: { a: true, b: true, c: false }
    grading: "symmetric"
    examples:
      - ticks: ["a"]
        score: "1/3"
      - ticks: ["a", "c"]
        score: "-1/3"

  # Two choices, none correct: the empty response judges every choice
  # correctly (multiple-selection.md, "Choices", no-correct-choice).
  - name: "No correct choice"
    choices: { a: false, b: false }
    grading: "partial"
    examples:
      - ticks: []
        score: 1.0
      - ticks: ["a"]
        score: 0.5
  - name: "No correct choice"
    choices: { a: false, b: false }
    grading: "all-or-nothing"
    examples:
      - ticks: []
        score: 1.0
      - ticks: ["a"]
        score: 0.0
  - name: "No correct choice"
    choices: { a: false, b: false }
    grading: "symmetric"
    examples:
      - ticks: []
        score: 1.0
      - ticks: ["a"]
        score: 0.0
      - ticks: ["a", "b"]
        score: -1.0

  # Two choices, both correct: ticking every choice scores 1
  # (multiple-selection.md, "Choices", all-choices-correct).
  - name: "Every choice correct"
    choices: { a: true, b: true }
    grading: "partial"
    examples:
      - ticks: ["a", "b"]
        score: 1.0
      - ticks: ["a"]
        score: 0.5
      - ticks: []
        score: 0.0
  - name: "Every choice correct"
    choices: { a: true, b: true }
    grading: "all-or-nothing"
    examples:
      - ticks: ["a", "b"]
        score: 1.0
      - ticks: ["a"]
        score: 0.0
  - name: "Every choice correct"
    choices: { a: true, b: true }
    grading: "symmetric"
    examples:
      - ticks: ["a", "b"]
        score: 1.0
      - ticks: ["a"]
        score: 0.0
      - ticks: []
        score: -1.0

  # A tick that names no choice, or that is not a string, is a malformed
  # response, never ignored.
  - name: "Malformed tick"
    choices: { a: true, b: false, c: true, d: false }
    grading: "symmetric"
    examples:
      - ticks: ["a", "c", "e"]
        score: "malformed"
      - ticks: ["e"]
        score: "malformed"
      - ticks: ["a", 1]
        score: "malformed"
