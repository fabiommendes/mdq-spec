# Document structure
#
# Question {
#   name: string
#   grading: "symmetric" | "all-or-nothing" | "partial"
#
#   // Mapping of scores
#   choices: { [key of string]: boolean }
#
#   // Mapping of examples to their scores
#   examples: { ticks: string[], score: number | Fraction }[]
# }
#
# Some scores are represented as fractions because the floating point
# representation would be inexact.
questions:
  # Symmetric grading
  - name: "Single correct choice"
    choices: { a: true, b: false, c: false, d: false }
    grading: "symmetric"
    examples:
      - ticks: ["a"]
        score: 1.0
      - ticks: []
        score: 0.5

  # Partial grading
  - name: "Single correct choice"
    choices: { a: true, b: false, c: false, d: false }
    grading: "partial"
    examples:
      - ticks: ["a"]
        score: 1.0
      - ticks: []
        score: 0.75

  # All-or-nothing grading
  - name: "Single correct choice"
    choices: { a: true, b: false, c: false, d: false }
    grading: "all-or-nothing"
    examples:
      - ticks: ["a"]
        score: 1.0
      - ticks: []
        score: 0.0
