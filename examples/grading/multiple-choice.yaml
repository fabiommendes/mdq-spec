# Document structure
#
# Question {
#   name: string
#   grading: "symmetric" | "partial"
#
#   // Mapping of scores
#   choices: { [key of string]: number | null | Fraction }
#
#   // Optional. The feedback of a choice by id (multiple-choice.md,
#   // "Feedback"). A choice with no entry has none.
#   feedback?: { [key of string]: string }
#
#   // Mapping of examples to their scores. The response is a choice id. A
#   // plain score does not check the feedback. The mapping form does:
#   // `feedback` is the list of feedback strings the response shows, empty
#   // for none. "malformed" is a response that names no choice: it is
#   // rejected, never scored (responses.md, "Errors").
#   examples: {
#     [key of string]: number | Fraction | "malformed"
#                    | { score: number | Fraction, feedback: string[] }
#   }
# }
#
# Some scores are represented as fractions because the floating point
# representation would be inexact.
questions:
  # Symmetric grading
  - name: "Single correct choice"
    choices: { a: 1.0, b: null, c: null, d: null }
    grading: "symmetric"
    examples:
      "a": 1.0
      "b": "-1/3"
      "c": "-1/3"
      "d": "-1/3"
  - name: "All choices have explicit scores"
    choices: { a: 1.0, b: 0.0, c: 0.0, d: 0.0 }
    grading: "symmetric"
    examples:
      "a": 1.0
      "b": 0.0
      "c": 0.0
      "d": 0.0
  - name: "Only one wrong choice is defined"
    choices: { a: 1.0, b: 0.0, c: null, d: null }
    grading: "symmetric"
    examples:
      "a": 1.0
      "b": 0.0
      "c": -0.5
      "d": -0.5
  - name: "Wrong choice with a negative value"
    choices: { a: 1.0, b: -0.5, c: null, d: null }
    grading: "symmetric"
    examples:
      "a": 1.0
      "b": -0.5
      "c": -0.25
      "d": -0.25
  - name: "Wrong choice with a partially correct option"
    choices: { a: 1.0, b: 0.5, c: null, d: null }
    grading: "symmetric"
    examples:
      "a": 1.0
      "b": 0.5
      "c": -0.75
      "d": -0.75
  - name: "Wrong choice with a many correct options"
    choices: { a: 1.0, b: 0.5, c: 0.5, d: null }
    grading: "symmetric"
    examples:
      "a": 1.0
      "b": 0.5
      "c": 0.5
      "d": -1.0
  # The remaining rows of the table in multiple-choice.md, "Grading".
  - name: "Two full-score choices"
    choices: { a: 1.0, b: 1.0, c: null, d: null }
    grading: "symmetric"
    examples:
      "a": 1.0
      "b": 1.0
      "c": -1.0
      "d": -1.0
  - name: "Three full-score choices, clamped below"
    choices: { a: 1.0, b: 1.0, c: 1.0, d: null }
    grading: "symmetric"
    examples:
      "a": 1.0
      "b": 1.0
      "c": 1.0
      "d": -1.0
  - name: "Negative score balances the correct one"
    choices: { a: 1.0, b: -1.0, c: null, d: null }
    grading: "symmetric"
    examples:
      "a": 1.0
      "b": -1.0
      "c": 0.0
      "d": 0.0
  - name: "Two negative scores, clamped above"
    choices: { a: 1.0, b: -1.0, c: -1.0, d: null }
    grading: "symmetric"
    examples:
      "a": 1.0
      "b": -1.0
      "c": -1.0
      "d": 0.0

  # Partial grading
  - name: "Single right choice"
    choices: { a: 1.0, b: null, c: 0.5, d: null }
    grading: "partial"
    examples:
      "a": 1.0
      "b": 0.0
      "c": 0.5
      "d": 0.0
  - name: "With partial score"
    choices: { a: 1.0, b: 0.5, c: null, d: null }
    grading: "partial"
    examples:
      "a": 1.0
      "b": 0.5
      "c": 0.0
      "d": 0.0
  - name: "With negative score"
    choices: { a: 1.0, b: -0.5, c: null, d: null }
    grading: "partial"
    examples:
      "a": 1.0
      "b": -0.5
      "c": 0.0
      "d": 0.0

  # The picked choice shows its own feedback. A choice with no score takes
  # the symmetric one: -(1.0 - 0.5) / 1.
  - name: "Feedback of the picked choice"
    choices: { brasilia: 1.0, rio: null, salvador: -0.5 }
    feedback:
      brasilia: "Correct -- Brasília became the capital in 1960."
      salvador: "Salvador was Brazil's colonial capital, not today's."
    grading: "symmetric"
    examples:
      "brasilia":
        score: 1.0
        feedback: ["Correct -- Brasília became the capital in 1960."]
      "salvador":
        score: -0.5
        feedback: ["Salvador was Brazil's colonial capital, not today's."]
      "rio":
        score: -0.5
        feedback: []

  # A response that names no choice is malformed.
  - name: "Unknown choice id"
    choices: { a: 1.0, b: null }
    grading: "symmetric"
    examples:
      "z": "malformed"
