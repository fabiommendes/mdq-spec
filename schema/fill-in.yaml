"$schema": "https://json-schema.org/draft/2020-12/schema"
"$id": "https://raw.githubusercontent.com/fabiommendes/mdq-spec/main/schema/fill-in.yaml"
title: Fill in the blanks question
description: >-
  A question whose stem contains one or more named blanks, each answered
  in place by the student. Extends the common question-base schema with a
  `blanks` field. Every blank is itself a small graded question -- a set
  of choices, a short answer, or a numeric value -- referenced from the
  stem by its id, as in `The capital of Brazil is [^capital].`

allOf:
  - "$ref": "./question-base.yaml"
  - type: object
    properties:
      type:
        const: fill-in

      blanks:
        type: array
        description: >-
          The blanks referenced by the stem, in the order their
          definitions appear in the document.
        items:
          "$ref": "#/$defs/Blank"
        minItems: 1

      grading:
        enum:
          - partial
          - no-mistakes
          - all-or-nothing
          - symmetric
          - inherit
        default: inherit
        description: >-
          The strategy used to grade the question, see the `Grading`
          section of the corresponding document in docs/question-types.
          `inherit`, the default, takes the exam's `grading` value (or
          its `fill-in` entry when that value is a map), and is `symmetric`
          outside an exam.

      shuffle:
        oneOf:
          - type: boolean
          - const: inherit
        default: inherit
        description: >-
          If true, the choices of every choice-based blank may be shown in any order. If false, an implementation must
          not change their order. `inherit`, the default, takes the exam's
          `shuffle` value, and is false outside an exam.

      diacritics:
        "$ref": "./short-answer.yaml#/$defs/diacritics"

      unmatched:
        "$ref": "./short-answer.yaml#/$defs/unmatched"
        description: >-
          Applies to every short answer blank of the question, with the
          same meaning as in a short answer question. If absent, each blank
          takes its own default: `incorrect` with an accept pattern and
          `manual` without one.

    required:
      - type
      - blanks

# Rejects any key not defined by question-base.yaml or by the object
# schema above. Plain `additionalProperties: false` can't be used here
# because it only sees properties declared in its *own* schema object,
# not sibling schemas combined via `allOf` -- `unevaluatedProperties`,
# evaluated after the whole `allOf` is applied, is the composition-safe
# equivalent.
unevaluatedProperties: false

"$defs":
  Blank:
    title: Blank
    description: >-
      A single blank. `type` discriminates the three kinds; it is
      required here even though the surface syntax may leave it implicit
      (`[^capital]:` is a choice blank, while `[^size/numeric]:` and
      `[^city/short-answer]:` state their kind).
    oneOf:
      - "$ref": "#/$defs/ChoiceBlank"
      - "$ref": "#/$defs/ShortAnswerBlank"
      - "$ref": "#/$defs/NumericBlank"

  BlankId:
    type: string
    description: >-
      Url-friendly identifier for the blank, matching the `[^id]` marker
      used in the stem. MUST be unique within the question.
    pattern: "^[a-zA-Z0-9]+(?:[-_][a-zA-Z0-9]+)*$"
    examples:
      - capital
      - size

  ChoiceBlank:
    type: object
    title: Choice blank
    description: >-
      A blank the student answers by picking one of a list of choices,
      graded exactly like a multiple-choice question.
    additionalProperties: false
    properties:
      id:
        "$ref": "#/$defs/BlankId"

      type:
        const: multiple-choice

      choices:
        type: array
        description: The list of choices presented for this blank.
        items:
          "$ref": "./multiple-choice.yaml#/$defs/Choice"
        minItems: 2

    required:
      - id
      - type
      - choices

  ShortAnswerBlank:
    type: object
    title: Short answer blank
    description: >-
      A blank the student answers by typing a short piece of text, graded
      exactly like a short-answer question. Carries the same answer
      machinery: `accept` and `reject` pattern lists, which can attach
      feedback.
    additionalProperties: false
    properties:
      id:
        "$ref": "#/$defs/BlankId"

      type:
        const: short-answer

      accept:
        description: >-
          Patterns matching a correct response. In Markdown, the
          `[^id/short-answer]` block (alias `[^id/short-answer/accept]`)
          sets it; a response is correct if it matches any entry.
        "$ref": "./short-answer.yaml#/$defs/patternList"

      reject:
        description: >-
          Patterns matching a known incorrect response. In Markdown, the
          `[^id/short-answer/reject]` block sets it. A response that matches
          no `accept` pattern and matches a `reject` pattern is incorrect. So
          `reject` settles responses that `unmatched: manual` would leave
          pending, and it attaches feedback. `accept` wins when both match.
        "$ref": "./short-answer.yaml#/$defs/patternList"

      preAccept:
        description: >-
          Patterns a submission must match to be considered valid. A
          pre-submission validator; plays no part in grading. In Markdown,
          the `preAccept` map of the frontmatter sets it, keyed by blank id
          (`preAccept: {<id>: [...]}`).
        "$ref": "./short-answer.yaml#/$defs/patternList"

      preReject:
        description: >-
          Patterns a submission must not match to be considered valid.
          Like `preAccept`, never affects a score. When a response matches
          both, it is treated as rejected -- the opposite of the
          `accept`/`reject` precedence used when grading. In Markdown, the
          `preReject` map of the frontmatter sets it, keyed by blank id
          (`preReject: {<id>: [...]}`).
        "$ref": "./short-answer.yaml#/$defs/patternList"

      incorrectFeedback:
        type: string
        description: >-
          Feedback for an incorrect response that no pattern gave feedback
          to, with the same meaning as the `incorrectFeedback` of a
          short-answer question (short-answer.md, "Feedback"). Inline
          markdown, like the feedback of a pattern. In Markdown, the
          `incorrectFeedback` map of the frontmatter sets it, keyed by blank
          id (`incorrectFeedback: {<id>: ...}`).

    required:
      - id
      - type

  NumericBlank:
    type: object
    title: Numeric blank
    description: >-
      A blank the student answers with a number, graded exactly like a
      numeric question.
    additionalProperties: false
    properties:
      id:
        "$ref": "#/$defs/BlankId"

      type:
        const: numeric

      answer:
        description: >-
          The expected correct numeric value: a number, or a string in
          the same grammar as a numeric body's value, e.g. "1/3", "2.50",
          "390000000000" or "6.022e23" (docs/question-types/numeric.md, "Answer
          representation"). Parsed from Markdown, a fraction, an integer
          outside the 32-bit signed range and a decimal whose digits as
          written differ from the shortest form of the nearest double (such
          as "2.50" or "1.50e3") stay strings. Written directly,
          either form MAY be used. A fraction's denominator MUST NOT be
          zero.
        oneOf:
          - type: number
          - type: string
            pattern: "^[+-]?(?:(?:0|[1-9][0-9]*)/[1-9][0-9]*|(?:(?:0|[1-9][0-9]*)\\.[0-9]+|0|[1-9][0-9]*)(?:[eE][+-]?[0-9]{1,3})?)$"

      unit:
        type: string
        description: >-
          The unit (e.g., kg, m, lm, etc) of the expected answer. Any character
          except the brackets and UNICODE_SPACE (docs/references/grammar.md).
        pattern: "^[^()\\[\\]\\t\\n\\v\\f\\r \\x85\\xa0\\u1680\\u2000-\\u200a\\u2028\\u2029\\u202f\\u205f\\u3000]+$"

      domain:
        enum:
          - integer
          - decimal
          - fraction
        description: >-
          The kind of number the response is. Inferred when absent: the widest of
          the answer and the absolute tolerance, ranked integer < fraction <
          decimal. It decides which responses are valid
          (docs/question-types/numeric.md, "Number type/domain"). In
          Markdown, the `domain` map of the frontmatter sets it, keyed by
          blank id (`domain: {<id>: ...}`), and wins over the inferred value.

      decimalPlaces:
        type: integer
        minimum: 0
        description: >-
          The precision of the comparison: the response and the answer are
          rounded to this many decimal places before the tolerance test.
          Ignored if domain is 'integer' or 'fraction'. In Markdown, the
          `decimalPlaces` map of the frontmatter sets it, keyed by blank id
          (`decimalPlaces: {<id>: ...}`), and wins over the inferred value.

      tolerance:
        "$ref": "./numeric.yaml#/$defs/Tolerance"

      incorrectFeedback:
        type: string
        description: >-
          Feedback for an incorrect response: a well-formed response outside
          the accepted tolerance, with the same meaning as the
          `incorrectFeedback` of a numeric question (numeric.md, "Feedback").
          Inline markdown, like the feedback of a pattern. In Markdown, the
          `incorrectFeedback` map of the frontmatter sets it, keyed by blank
          id (`incorrectFeedback: {<id>: ...}`).

    required:
      - id
      - type
      - answer
