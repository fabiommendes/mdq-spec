"$schema": "https://json-schema.org/draft/2020-12/schema"
"$id": "https://raw.githubusercontent.com/fabiommendes/mdq-spec/main/schema/fill-in.yaml"
title: Fill in the blanks question
description: >-
  A question whose stem contains one or more named blanks, each answered
  in place by the student. Extends the common question-base schema with a
  `blanks` field. Every blank is itself a small graded question -- a set
  of choices, a short answer, or a numeric value -- referenced from the
  stem by its id, as in `The capital of Brazil is [^capital].`

allOf:
  - "$ref": "./question-base.yaml"
  - type: object
    properties:
      type:
        const: fill-in

      blanks:
        type: array
        description: >-
          The blanks referenced by the stem, in the order their
          definitions appear in the document.
        items:
          "$ref": "#/$defs/Blank"
        minItems: 1

      grading:
        enum:
          - partial
          - all-or-nothing
          - symmetric
          - inherit
        default: inherit
        description: >-
          The strategy used to grade the question, see the `Grading`
          section of the corresponding document in docs/question-types.
          `inherit`, the default, takes the exam's `grading` value, and
          is `symmetric` outside an exam. A `null` value is the same as
          an absent field.

      shuffle:
        oneOf:
          - type: boolean
          - const: inherit
        default: inherit
        description: >-
          If true, the choices of every choice-based blank are safe to shuffle. If false, they should
          never be shuffled. `inherit`, the default, takes the exam's
          `shuffle` value, and is false outside an exam.

      diacritics:
        "$ref": "./short-answer.yaml#/$defs/diacritics"

      unmatched:
        "$ref": "./short-answer.yaml#/$defs/unmatched"
        description: >-
          Applies to every short answer blank of the question, with the
          same meaning as in a short answer question.

    required:
      - type
      - blanks

# Rejects any key not defined by question-base.yaml or by the object
# schema above. Plain `additionalProperties: false` can't be used here
# because it only sees properties declared in its *own* schema object,
# not sibling schemas combined via `allOf` -- `unevaluatedProperties`,
# evaluated after the whole `allOf` is applied, is the composition-safe
# equivalent.
unevaluatedProperties: false

"$defs":
  Blank:
    title: Blank
    description: >-
      A single blank. `type` discriminates the three kinds; it is
      required here even though the surface syntax may leave it implicit
      (`[^capital]:` infers its kind from the definition that follows,
      while `[^size/numeric]:` states it).
    oneOf:
      - "$ref": "#/$defs/ChoiceBlank"
      - "$ref": "#/$defs/ShortAnswerBlank"
      - "$ref": "#/$defs/NumericBlank"

  BlankId:
    type: string
    description: >-
      Url-friendly identifier for the blank, matching the `[^id]` marker
      used in the stem. MUST be unique within the question.
    pattern: "^[a-zA-Z0-9]+(?:[-_][a-zA-Z0-9]+)*$"
    examples:
      - capital
      - size

  ChoiceBlank:
    type: object
    title: Choice blank
    description: >-
      A blank the student answers by picking one of a list of choices,
      graded exactly like a multiple-choice question.
    additionalProperties: false
    properties:
      id:
        "$ref": "#/$defs/BlankId"

      type:
        const: multiple-choice

      choices:
        type: array
        description: The list of choices presented for this blank.
        items:
          "$ref": "./multiple-choice.yaml#/$defs/Choice"
        minItems: 2

    required:
      - id
      - type
      - choices

  ShortAnswerBlank:
    type: object
    title: Short answer blank
    description: >-
      A blank the student answers by typing a short piece of text, graded
      exactly like a short-answer question. Carries the same answer
      machinery: a list of accepted responses, a regular expression, or
      `accept`/`reject` pattern lists that can attach feedback.
    additionalProperties: false
    properties:
      id:
        "$ref": "#/$defs/BlankId"

      type:
        const: short-answer

      accept:
        description: >-
          Patterns matching a correct response. The canonical form of the
          `[^id/short-answer/accept]` block; a response is correct if it
          matches any entry.
        "$ref": "./short-answer.yaml#/$defs/patternList"

      reject:
        description: >-
          Patterns matching a known incorrect response. The canonical form
          of the `[^id/short-answer/reject]` block. Rejecting never changes
          a score -- `accept` decides that, and wins when both match -- so
          this list exists to attach feedback to answers known to be wrong.
        "$ref": "./short-answer.yaml#/$defs/patternList"

      preAccept:
        description: >-
          Patterns a submission must match to be considered valid. A
          pre-submission validator; plays no part in grading.
        "$ref": "./short-answer.yaml#/$defs/patternList"

      preReject:
        description: >-
          Patterns a submission must not match to be considered valid.
          Like `preAccept`, never affects a score.
        "$ref": "./short-answer.yaml#/$defs/patternList"

    required:
      - id
      - type

  NumericBlank:
    type: object
    title: Numeric blank
    description: >-
      A blank the student answers with a number, graded exactly like a
      numeric question.
    additionalProperties: false
    properties:
      id:
        "$ref": "#/$defs/BlankId"

      type:
        const: numeric

      answer:
        description: >-
          The expected correct numeric value: a number, or a string in
          the same grammar as a numeric body's value, e.g. "1/3", "2.50"
          or "390000000000" (docs/question-types/numeric.md, "Answer
          representation"). Parsed from Markdown, a fraction, an integer
          outside the 32-bit signed range and a decimal that a float
          cannot hold digit by digit stay strings. Written directly,
          either form MAY be used. A fraction's denominator MUST NOT be
          zero.
        oneOf:
          - type: number
          - type: string
            pattern: "^[+-]?(?:(?:0|[1-9][0-9]*)/[1-9][0-9]*|(?:0|[1-9][0-9]*)\\.[0-9]+|0|[1-9][0-9]*)$"

      unit:
        type: string
        description: >-
          The unit (e.g., kg, m, lm, etc) of the expected answer. Any character
          except the brackets and UNICODE_SPACE (docs/references/grammar.md).
        pattern: "^[^()\\[\\]\\t\\n\\v\\f\\r \\x85\\xa0\\u1680\\u2000-\\u200a\\u2028\\u2029\\u202f\\u205f\\u3000]+$"

      domain:
        enum:
          - integer
          - decimal
          - fraction
        description: The domain/kind of number for the response.

      decimalPlaces:
        type: integer
        minimum: 0
        description: >-
          The number of decimal places used in the decimal value
          representation. Ignored if domain is 'integer' or 'fraction'.

      tolerance:
        "$ref": "./numeric.yaml#/$defs/Tolerance"

    required:
      - id
      - type
      - answer
