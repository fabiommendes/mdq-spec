"$schema": "https://json-schema.org/draft/2020-12/schema"
"$id": "https://raw.githubusercontent.com/fabiommendes/mdq-spec/main/schema/short-answer.yaml"
title: Short answer question
description: >-
  A question answered with a short piece of free text, graded by comparing
  the response against a list of accepted patterns. Extends the common question-base schema.

allOf:
  - "$ref": "./question-base.yaml"
  - type: object
    properties:
      type:
        const: short-answer

      accept:
        description: >-
          Patterns matching a correct response. In Markdown, the
          `[short-answer]` block (alias `[short-answer/accept]`) sets it; a
          response is correct if it matches any entry. The single-line form
          gives a list of one entry.
        "$ref": "#/$defs/patternList"

      reject:
        description: >-
          Patterns matching a known incorrect response. In Markdown, the
          `[short-answer/reject]` block sets it. A response that matches no
          `accept` pattern and matches a `reject` pattern is incorrect. So
          `reject` settles responses that `unmatched: manual` would leave
          pending, and it attaches feedback. `accept` wins when both match.
        "$ref": "#/$defs/patternList"

      preAccept:
        description: >-
          Patterns a submission must match to be considered valid. A
          pre-submission validator: systems should warn the student before
          accepting the answer. Plays no part in grading.
        "$ref": "#/$defs/patternList"

      preReject:
        description: >-
          Patterns a submission must not match to be considered valid. Like
          `preAccept`, a pre-submission validator that never affects a score.
          When a response matches both, it is treated as rejected -- the
          opposite of the `accept`/`reject` precedence used when grading.
        "$ref": "#/$defs/patternList"

      diacritics:
        "$ref": "#/$defs/diacritics"

      unmatched:
        "$ref": "#/$defs/unmatched"

      incorrectFeedback:
        type: string
        description: >-
          Feedback for an incorrect response that no pattern gave feedback
          to: a response that matches no pattern under `unmatched:
          incorrect`, or one that matches a `reject` pattern with no
          feedback. Inline markdown, like the feedback of a pattern.

    required:
      - type

"$defs":
  diacritics:
    enum:
      - fold
      - keep
    default: fold
    description: >-
      How inexact literals treat diacritics. `fold` strips them from both the pattern and the
      response before comparing; `keep` preserves them. Regexes and
      backtick-enclosed literals are unaffected.
      See the `Diacritics` section of docs/question-types/short-answer.md.

  unmatched:
    enum:
      - incorrect
      - manual
    description: >-
      What becomes of a response that matches no `accept` and no `reject`
      pattern. `incorrect` scores it 0; `manual` leaves it pending, for the
      instructor to score by hand. There is no fixed default: when absent,
      it is `incorrect` for a question (or blank) with at least one `accept`
      pattern and `manual` for one with none. See the `Grading` section of
      docs/question-types/short-answer.md.

  patternList:
    type: array
    description: >-
      A list of answer patterns, tried in the order written.
    minItems: 1
    items:
      "$ref": "#/$defs/pattern"

  pattern:
    description: >-
      One answer pattern, written either as a bare string or as an object
      carrying feedback and comments alongside it.
    oneOf:
      - "$ref": "#/$defs/patternString"
      - type: object
        properties:
          pattern:
            "$ref": "#/$defs/patternString"
          feedback:
            type: string
            description: >-
              Shown by the selection rule of short-answer.md, "Feedback": the
              first pattern that matches and has feedback, in the list that
              decided the outcome. For `preAccept` and `preReject`, see
              "Pre-validation".
          comment:
            type: string
            description: >-
              An author-facing note. Never shown to students.
        required:
          - pattern
        additionalProperties: false

  patternString:
    type: string
    description: >-
      A regular expression when delimited by `/`, an exact literal when
      enclosed in backticks, and an inexact literal otherwise.
    minLength: 1
    # Explicit classes only, no `\s` or `\S` (grammar.md, "Regex dialect"),
    # aligned with EXACT_TEXT and PLAIN_TEXT (short-answer.md, "Body"): no
    # CR or LF in the pattern. Spaces and tabs at both ends are removed
    # before the pattern is classified (patterns.md, "Pattern string"), so
    # they are allowed here. A pattern of only spaces and tabs passes: it is
    # a `blank-text`, which the models report (a schema cannot see U+200B or
    # an exact literal of one space). A pattern that opens with a backtick
    # is an exact literal, a CommonMark code span (patterns.md, "Exact
    # literals"): there is no inexact literal starting with a backtick.
    # APPROXIMATION: the exact rule is that the run of backticks that
    # closes the span has the same length as the one that opens it, and
    # that no run of that length is inside. A JSON Schema pattern is
    # ECMA-262, and portable validators do not support the backreference
    # that the rule needs. This pattern only checks that the string opens
    # and closes with a backtick and holds a character between them. The
    # models check the rest and report it as `schema-error`.
    # `minLength` rejects the empty string.
    pattern: "^[ \\t]*(?:`[^\\r\\n]+`[ \\t]*|[^` \\t\\r\\n][^\\r\\n]*)?$"


# Rejects any key not defined by question-base.yaml or by the object
# schema above. Plain `additionalProperties: false` can't be used here
# because it only sees properties declared in its *own* schema object,
# not sibling schemas combined via `allOf` -- `unevaluatedProperties`,
# evaluated after the whole `allOf` is applied, is the composition-safe
# equivalent.
unevaluatedProperties: false
