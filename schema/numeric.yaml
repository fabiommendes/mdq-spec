"$schema": "https://json-schema.org/draft/2020-12/schema"
"$id": "https://raw.githubusercontent.com/fabiommendes/mdq-spec/main/schema/numeric.yaml"
title: Numeric question
description: >-
  A question where the student must enter a numeric value, graded against
  an expected answer within an optional tolerance. Extends the common
  question-base schema with the `answer`, `unit`, `domain`,
  `decimalPlaces`, `tolerance` and `incorrectFeedback` fields.

allOf:
  - "$ref": "./question-base.yaml"
  - type: object
    properties:
      type:
        const: numeric

      answer:
        description: >-
          The expected correct numeric value: a number, or a string in
          the same grammar as a numeric body's value, e.g. "1/3", "2.50",
          "390000000000" or "6.022e23" (docs/question-types/numeric.md, "Answer
          representation"). Parsed from Markdown, a fraction, an integer
          outside the 32-bit signed range and a decimal whose digits as
          written differ from the shortest form of the nearest double (such
          as "2.50" or "1.50e3") stay strings. Written directly,
          either form MAY be used. A fraction's denominator MUST NOT be
          zero.
        oneOf:
          - type: number
          - type: string
            pattern: "^[+-]?(?:(?:0|[1-9][0-9]*)/[1-9][0-9]*|(?:(?:0|[1-9][0-9]*)\\.[0-9]+|0|[1-9][0-9]*)(?:[eE][+-]?[0-9]{1,3})?)$"

      unit:
        type: string
        description: >-
          The unit (e.g., kg, m, lm, etc) of the expected answer. Any character
          except the brackets and UNICODE_SPACE (docs/references/grammar.md).
        pattern: "^[^()\\[\\]\\t\\n\\v\\f\\r \\x85\\xa0\\u1680\\u2000-\\u200a\\u2028\\u2029\\u202f\\u205f\\u3000]+$"

      domain:
        enum:
          - integer
          - decimal
          - fraction
        description: >-
          The kind of number the response is. Inferred when absent: the widest of
          the answer and the absolute tolerance, ranked integer < fraction <
          decimal. It decides which responses are valid
          (docs/question-types/numeric.md, "Number type/domain").

      decimalPlaces:
        type: integer
        minimum: 0
        description: >-
          The precision of the comparison: the response and the answer are
          rounded to this many decimal places before the tolerance test.
          Ignored if domain is 'integer' or 'fraction'.

      tolerance:
        "$ref": "#/$defs/Tolerance"

      incorrectFeedback:
        type: string
        description: >-
          Feedback for an incorrect response: a well-formed response outside
          the accepted tolerance. Never shown for a correct, malformed or
          skipped response (docs/question-types/numeric.md, "Feedback").
          Block Markdown (paragraphs allowed) with at least one visible
          character.

    required:
      - type
      - answer

# Rejects any key not defined by question-base.yaml or by the object
# schema above. Plain `additionalProperties: false` can't be used here
# because it only sees properties declared in its *own* schema object,
# not sibling schemas combined via `allOf` -- `unevaluatedProperties`,
# evaluated after the whole `allOf` is applied, is the composition-safe
# equivalent.
unevaluatedProperties: false

"$defs":
  Tolerance:
    type: object
    title: Tolerance
    description: >-
      Acceptable margin of error around the expected answer. At least one
      field is required (an empty mapping is not a tolerance); when both are
      given, a response is accepted if it satisfies either one.
    minProperties: 1
    additionalProperties: false
    properties:
      absolute:
        type: number
        description: >-
          Maximum allowed absolute difference between the response and the
          answer, i.e. |response - answer| <= absolute.
        minimum: 0

      relative:
        type: number
        description: >-
          Maximum allowed relative difference between the response and the
          answer, expressed as a fraction (e.g. 0.05 for 5%),
          i.e. |response - answer| <= |answer| * relative.
        minimum: 0
