"$schema": "https://json-schema.org/draft/2020-12/schema"
"$id": "https://raw.githubusercontent.com/fabiommendes/mdq-spec/main/schema/essay.yaml"
title: Essay question
description: >-
  An open-ended question where the student writes a free-form answer,
  rather than choosing among predefined options. Extends the common
  question-base schema with an `input` field describing how the answer
  should be edited, and an optional answer key.

allOf:
  - "$ref": "./question-base.yaml"
  - type: object
    properties:
      type:
        const: essay

      input:
        type: string
        description: >-
          The kind of editor shown to the student. `text` is a formatted
          (rich text) editor, `plain` a plain text box, and `code` a code
          editor, which is normally paired with `highlight`.
        enum:
          - code
          - text
          - plain
        default: text

      highlight:
        type: string
        description: >-
          Programming language used for syntax highlighting and, where
          supported, validation. Only applicable when `input` is `code`;
          it is ignored (and the linter warns) for any other input.
        minLength: 1
        examples:
          - python
          - javascript
          - sql

      answerKey:
        type: string
        description: >-
          A model answer. It guides the instructor while grading and MAY be
          shown to students as feedback afterwards.
        minLength: 1
        pattern: "\\S"

    required:
      - type

# Rejects any key not defined by question-base.yaml or by the object
# schema above. Plain `additionalProperties: false` can't be used here
# because it only sees properties declared in its *own* schema object,
# not sibling schemas combined via `allOf` -- `unevaluatedProperties`,
# evaluated after the whole `allOf` is applied, is the composition-safe
# equivalent.
unevaluatedProperties: false
