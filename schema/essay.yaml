"$schema": "https://json-schema.org/draft/2020-12/schema"
"$id": "https://raw.githubusercontent.com/fabiommendes/mdq-spec/main/schema/essay.yaml"
title: Essay question
description: >-
  An open-ended question where the student writes a free-form answer,
  rather than choosing among predefined options. Extends the common
  question-base schema with a `content` field describing how the answer
  should be edited, and an optional answer key.

allOf:
  - "$ref": "./question-base.yaml"
  - type: object
    properties:
      type:
        const: essay

      content:
        type: string
        description: >-
          The kind of response the student writes, and so the kind of editor
          shown. `text` is a formatted (rich text) editor, `plain` a plain
          text box, and `code` a code editor, which is normally paired with
          `highlight`.
        enum:
          - code
          - text
          - plain
        default: text

      highlight:
        type: string
        description: >-
          Programming language used for syntax highlighting. Only allowed
          when `content` is `code`; with any other content, or with no
          `content` (which defaults to `text`), it is a `schema-error`. An
          empty string is a `schema-error` too.
        minLength: 1
        examples:
          - python
          - javascript
          - sql

      answerKey:
        type: string
        description: >-
          A model answer, written as Markdown. In a Markdown source it is the
          content of the `## [answer-key]` section, without the heading. It
          guides the instructor while grading. A host MUST NOT show it to the
          student before the student submits the response, and MAY show it
          after, even while the response is pending. An empty or
          whitespace-only value is a `blank-text` error, like `title`.

    required:
      - type

    # `highlight` is allowed only for code content. `content` defaults to
    # `text`, so `highlight` with no `content` is also an error.
    if:
      required:
        - highlight
    then:
      required:
        - content
      properties:
        content:
          const: code

# Rejects any key not defined by question-base.yaml or by the object
# schema above. Plain `additionalProperties: false` can't be used here
# because it only sees properties declared in its *own* schema object,
# not sibling schemas combined via `allOf` -- `unevaluatedProperties`,
# evaluated after the whole `allOf` is applied, is the composition-safe
# equivalent.
unevaluatedProperties: false
