"$schema": "https://json-schema.org/draft/2020-12/schema"
"$id": "https://raw.githubusercontent.com/fabiommendes/mdq-spec/main/schema/multiple-selection.yaml"
title: Multiple selection question
description: >-
  A question where the student must select all choices they believe are
  correct, out of a list of options (zero, one, or many may be correct).
  Extends the common question-base schema with the `choices`, `grading`
  and `shuffle` fields.

allOf:
  - "$ref": "./question-base.yaml"
  - type: object
    properties:
      type:
        const: multiple-selection

      choices:
        type: array
        description: The list of choices presented to the student.
        items:
          "$ref": "#/$defs/Choice"
        minItems: 2

      grading:
        enum:
          - partial
          - all-or-nothing
          - symmetric
          - inherit
        default: inherit
        description: >-
          The strategy used to grade the question, see the `Grading`
          section of the corresponding document in docs/question-types.
          `inherit`, the default, takes the strategy the exam's `grading`
          gives for multiple selection: its `multiple-selection` entry when it is a map,
          `symmetric` if the exam has no `grading` or its map has no
          `multiple-selection` entry, or the translation of a scalar by the table of docs/exam.md (Grading). It is `symmetric`
          outside an exam.

      shuffle:
        oneOf:
          - type: boolean
          - const: inherit
        default: inherit
        description: >-
          If true, the choices may be shown in any order. If false, an implementation must
          not change their order. `inherit`, the default, takes the exam's
          `shuffle` value, and is false outside an exam.

    required:
      - type
      - choices

# Rejects any key not defined by question-base.yaml or by the object
# schema above. Plain `additionalProperties: false` can't be used here
# because it only sees properties declared in its *own* schema object,
# not sibling schemas combined via `allOf` -- `unevaluatedProperties`,
# evaluated after the whole `allOf` is applied, is the composition-safe
# equivalent.
unevaluatedProperties: false

"$defs":
  Choice:
    type: object
    title: Choice
    description: A single option in a multiple-selection question.
    additionalProperties: false
    properties:
      id:
        type: string
        description: Unique url-friendly identifier for the choice.
        pattern: "^[a-zA-Z0-9]+(?:[-_][a-zA-Z0-9]+)*$"
        examples:
          - berlin
          - red-green-and-blue

      text:
        type: string
        description: A textual display for the choice.

      correct:
        type: boolean
        description: >-
          Whether this choice should be selected in a correct answer.
          Required: every choice states its verdict, unlike multiple-choice
          where a blank `[ ]` omits `score`.

      feedback:
        type: string
        description: >-
          Feedback text shown to students that judged this choice wrongly
          -- either by ticking one that should not be ticked, or by
          leaving unticked one that should be. Usually explains why the
          choice belongs in the answer or does not. Unlike
          multiple-choice, a correctly judged choice never shows it.

      comment:
        type: string
        description: >-
          Optional comment for the instructor. Do not show to students.

    required:
      - text
      - correct
