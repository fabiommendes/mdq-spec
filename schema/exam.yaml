"$schema": "https://json-schema.org/draft/2020-12/schema"
"$id": "https://raw.githubusercontent.com/fabiommendes/mdq-spec/main/schema/exam.yaml"
title: Exam
description: >-
  A set of questions gathered for assessment. An exam is recognized by its
  H1 title, which a question document can never carry. Each entry in
  `questions` is either a complete question document or an `include`
  referring to one that lives elsewhere.

type: object
properties:
  type:
    const: exam
    description: >-
      Redundant in practice -- an exam is recognized by its H1 title --
      but accepted so a document can state its kind explicitly.

  id:
    type: string
    description: >-
      Identifier of the exam, written either in the H1 (`# [slug] Title`)
      or in the frontmatter. It SHOULD be url-safe; an id that is not gets
      the `unsafe-id` lint warning and can only be written in the
      frontmatter. It MUST be a YAML string: a number is a schema error,
      never converted.
    minLength: 1
    examples:
      - midterm
      - cs101-final

  uuid:
    type: string
    description: Universally unique identifier for the exam.
    format: uuid
    pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"

  title:
    type: string
    description: >-
      Human readable title, normally taken from the H1 heading. When the
      frontmatter also sets it, the frontmatter wins.
    minLength: 1

  description:
    type: string
    description: >-
      A short summary shown in exam listings, giving a little more detail
      than the title alone. Not inherited by the questions.
    minLength: 1

  course:
    type: string
    description: The course code the exam belongs to.
    minLength: 1

  author:
    type: string
    description: >-
      The exam author. Inherited by any question that does not name one.
    minLength: 1

  locale:
    type: string
    description: >-
      The language the exam is written in, as an IETF BCP 47 language
      tag, well-formed under the RFC 5646 grammar (registration is not
      checked). Inherited by any question that does not set one. The
      check is left to the implementation (`malformed-locale`).
    examples:
      - pt-BR
      - en

  instructions:
    type: string
    description: >-
      The paragraphs between the title and the first question, shown to
      the student before the assessment begins. May contain Markdown.
    minLength: 1

  tags:
    type: array
    description: >-
      Arbitrary set of strings associated with the exam. Unlike `locale`
      and `author`, tags are NOT inherited by the questions.
    items:
      type: string
    uniqueItems: true

  meta:
    type: object
    description: >-
      Arbitrary mapping of strings to JSON values, for extension data not
      covered by the standard fields.
    additionalProperties: true

  grading:
    description: >-
      The grading strategy applied to the questions of the exam that do
      not declare their own. Either a single strategy for every question,
      or a mapping from question type to strategy. Types absent from the
      mapping are graded as `symmetric`. A question that declares its own
      `grading` ignores this field entirely.
    oneOf:
      - "$ref": "#/$defs/GradingStrategy"
      - type: object
        additionalProperties: false
        properties:
          multiple-choice:
            "$ref": "#/$defs/GradingStrategy"
          multiple-selection:
            "$ref": "#/$defs/GradingStrategy"
          true-false:
            "$ref": "#/$defs/GradingStrategy"
          fill-in:
            "$ref": "#/$defs/GradingStrategy"
    default: symmetric

  shuffle:
    type: boolean
    default: false
    description: >-
      The `shuffle` value of every question whose own `shuffle` is
      `inherit`. Defaults to false.

  penalty:
    enum:
      - none
      - capped
      - full
    default: none
    description: >-
      The exam's policy for whether a negative question score survives.
      Questions never clamp their own score -- this is the only place
      clamping happens. `none` floors each question score at 0 before
      weighting it into the total. `capped` keeps the full, possibly
      negative, question values but floors the exam total at 0. `full`
      floors nothing, at either level.

  start:
    type: string
    description: >-
      When the exam begins, as an ISO 8601 date or date-time. A value with
      no UTC offset is in the local time of whoever administers the exam.
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9]{2}:[0-9]{2}(:[0-9]{2}(\\.[0-9]+)?)?(Z|[+-][0-9]{2}:[0-9]{2})?)?$"
    examples:
      - "2026-03-10"
      - "2026-03-10T09:00:00"
      - "2026-03-10T09:00:00-03:00"

  duration:
    type: string
    description: >-
      How long the exam lasts, as an ISO 8601 duration. Only fixed-length
      units are allowed (weeks, days, hours, minutes, seconds): years and
      months have no fixed length. The surface shorthands `HH:MM` and
      `Xd Yh Zm` allowed in the Markdown document are normalized to this form.
    pattern: "^P(?!$)([0-9]+W)?([0-9]+D)?(T(?=[0-9])([0-9]+H)?([0-9]+M)?([0-9]+(\\.[0-9]+)?S)?)?$"
    examples:
      - PT1H30M
      - P1DT2H

  questions:
    type: array
    description: >-
      The questions, in the order their blocks appear in the document.
      An entry is either a full question document or an `include`.
    items:
      "$ref": "#/$defs/Entry"

required:
  - questions

additionalProperties: false

"$defs":
  GradingStrategy:
    enum:
      - partial
      - all-or-nothing
      - symmetric

  Entry:
    title: Exam entry
    description: >-
      One question block: either a question written inline, or a
      reference to one stored elsewhere.
    oneOf:
      - "$ref": "#/$defs/Include"
      - "$ref": "#/$defs/IncludeAll"
      - "$ref": "./multiple-choice.yaml"
      - "$ref": "./multiple-selection.yaml"
      - "$ref": "./true-false.yaml"
      - "$ref": "./essay.yaml"
      - "$ref": "./numeric.yaml"
      - "$ref": "./short-answer.yaml"
      - "$ref": "./fill-in.yaml"
      - "$ref": "./ordering.yaml"

  Include:
    type: object
    title: Include
    description: >-
      A reference to a question defined outside this exam, by its id.
      Resolving the reference is the host system's job; a document that
      merely fails to resolve is still well-formed.
    additionalProperties: false
    properties:
      include:
        type: string
        description: The id of the question to pull in.
        minLength: 1
        examples:
          - recursion-01
    required:
      - include

  IncludeAll:
    type: object
    title: Include all
    description: >-
      A query for questions defined outside this exam. Adds every question
      that matches it, except the ones the exam already contains through
      an `include`, a declared inline id, or an earlier `include-all`.
      Resolving the query is the host system's job; a document that
      merely fails to resolve is still well-formed.
    additionalProperties: false
    properties:
      include-all:
        type: string
        minLength: 1
        description: >-
          The query. docs/exam.md recommends a language of tags combined
          with AND, OR, NOT and parentheses, followed by an optional
          EXCEPT with a comma-separated list of question ids.
        examples:
          - recursion AND NOT draft EXCEPT recursion-07
      max:
        type: integer
        minimum: 1
        description: >-
          The maximum number of questions to add. Which ones are kept is
          implementation-defined.
    required:
      - include-all
