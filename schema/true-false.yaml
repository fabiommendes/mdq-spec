"$schema": "https://json-schema.org/draft/2020-12/schema"
"$id": "https://raw.githubusercontent.com/fabiommendes/mdq-spec/main/schema/true-false.yaml"
title: True/False question
description: >-
  A question where the student must judge each statement in a list as
  true or false. Extends the common question-base schema with a
  `choices` field, where each choice represents one statement to be
  judged.

allOf:
  - "$ref": "./question-base.yaml"
  - type: object
    properties:
      type:
        const: true-false

      choices:
        type: array
        description: >-
          The list of statements presented to the student, each to be
          judged as true or false.
        items:
          "$ref": "#/$defs/Choice"
        minItems: 2

      grading:
        enum:
          - partial
          - all-or-nothing
          - symmetric
          - inherit
        default: inherit
        description: >-
          The strategy used to grade the question, see the `Grading`
          section of the corresponding document in docs/question-types.
          `inherit`, the default, takes the exam's `grading` value, and
          is `symmetric` outside an exam. A `null` value is the same as
          an absent field.

      shuffle:
        oneOf:
          - type: boolean
          - const: inherit
        default: inherit
        description: >-
          If true, the statements are safe to shuffle. If false, they should
          never be shuffled. `inherit`, the default, takes the exam's
          `shuffle` value, and is false outside an exam.

    required:
      - type
      - choices

# Rejects any key not defined by question-base.yaml or by the object
# schema above. Plain `additionalProperties: false` can't be used here
# because it only sees properties declared in its *own* schema object,
# not sibling schemas combined via `allOf` -- `unevaluatedProperties`,
# evaluated after the whole `allOf` is applied, is the composition-safe
# equivalent.
unevaluatedProperties: false

"$defs":
  Choice:
    type: object
    title: Choice
    description: A single statement in a true/false question.
    additionalProperties: false
    properties:
      id:
        type: string
        description: Unique url-friendly identifier for the choice.
        pattern: "^[a-zA-Z0-9]+(?:[-_][a-zA-Z0-9]+)*$"
        examples:
          - berlin
          - red-green-and-blue

      text:
        type: string
        description: A textual display for the statement.
        minLength: 1

      correct:
        type: boolean
        description: >-
          Whether the statement is true. Required: every statement states
          its verdict.

      marker:
        type: string
        description: >-
          The single letter written between the brackets in the source
          document (`T`, `F`, `V`, ...). Preserved verbatim: `correct`
          carries the meaning, but the letter itself is needed to warn
          about WARNING letters and locale mismatches, and to
          round-trip the document unchanged.
        minLength: 1
        maxLength: 1

      feedback:
        type: string
        description: >-
          Feedback text shown to students that judged this statement
          incorrectly or left it unjudged. Usually explains why the
          statement is true or false.
        minLength: 1

      comment:
        type: string
        description: >-
          Optional comment for the instructor. Do not show to students.
        minLength: 1

    required:
      - text
      - correct
