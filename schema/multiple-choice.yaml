"$schema": "https://json-schema.org/draft/2020-12/schema"
"$id": "https://raw.githubusercontent.com/codehood-lms/mdq.spec/master/schema/multiple-choice.yaml"
title: Multiple choice question
description: >-
  A question where the student must select exactly one choice out of a
  list of options. Extends the common question-base schema with a
  `choices` field.

allOf:
  - "$ref": "./question-base.yaml"
  - type: object
    properties:
      type:
        const: multiple-choice

      choices:
        type: array
        description: The list of choices presented to the student.
        items:
          "$ref": "#/$defs/Choice"
        minItems: 2

      grading:
        enum:
          - partial
          - all-or-nothing
          - symmetric
        description: >-
          The strategy used to grade the question, see the `Grading`
          section of the corresponding document in docs/question-types.
          If omitted, the exam's `grading` field selects one, and
          `symmetric` applies when neither does.

      shuffle:
        type: boolean
        description: >-
          If true, the choices are safe to shuffle. If false, they should never
          be shuffled and if ommited, use the system is free to choose.

    required:
      - type
      - choices

# Rejects any key not defined by question-base.yaml or by the object
# schema above. Plain `additionalProperties: false` can't be used here
# because it only sees properties declared in its *own* schema object,
# not sibling schemas combined via `allOf` -- `unevaluatedProperties`,
# evaluated after the whole `allOf` is applied, is the composition-safe
# equivalent.
unevaluatedProperties: false

"$defs":
  Choice:
    type: object
    title: Choice
    description: A single option in a multiple-choice question.
    additionalProperties: false
    properties:
      id:
        type: string
        description: Unique url-friendly identifier for the choice.
        pattern: "^[a-zA-Z0-9]+(?:[-_][a-zA-Z0-9]+)*$"
        examples:
          - berlin
          - red-green-and-blue

      text:
        type: string
        description: A textual display for the choice.
        minLength: 1

      score:
        type: number
        minimum: -1
        maximum: 1
        description: >-
          Numeric grade associated with the choice, on a scale from -1 to
          1. 1 is considered correct and 0 incorrect. The instructor may
          omit this for incorrect choices, or set negative values as
          penalties for selecting a wrong choice. A question never clamps
          its own score -- whether a negative value survives into the
          exam total is decided entirely by the exam's `penalty` policy
          (see schema/exam.yaml), never here. A value outside [-1, 1] is a
          malformed question, not a clamped grade.

      feedback:
        type: string
        description: >-
          Feedback text shown to students that selected this choice.
          Usually explains why the choice is wrong (or right).

      comment:
        type: string
        description: >-
          Optional comment for the instructor. Do not shown to students.

    required:
      - text
