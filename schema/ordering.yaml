"$schema": "https://json-schema.org/draft/2020-12/schema"
"$id": "https://raw.githubusercontent.com/codehood-lms/mdq.spec/master/schema/ordering.yaml"
title: Ordering question
description: >-
  A question where the student sorts a list of lines into the correct
  order. Extends the common question-base schema with the `lines` that
  form the answer key, the distractor lines mixed in with them, and the
  alternative orderings the question accepts or rejects outright.

allOf:
  - "$ref": "./question-base.yaml"
  - type: object
    properties:
      type:
        const: ordering

      lines:
        description: >-
          The lines to be ordered, in the correct order -- this is the
          answer key. Students are always shown them shuffled, together
          with `extra`. The same line may appear more than once; each
          occurrence is a separate copy the student must place.
        "$ref": "#/$defs/Lines"
        minItems: 2

      extra:
        description: >-
          Distractor lines, shuffled in among `lines` and never part of a
          correct response. A distractor may repeat a line of `lines`,
          which hands the student a spare copy of a line they do need.
        "$ref": "#/$defs/Lines"

      accept:
        type: array
        description: >-
          Alternative orderings that are also correct, each scoring 1 like
          `lines` itself.
        items:
          "$ref": "#/$defs/Alternative"
        minItems: 1

      reject:
        type: array
        description: >-
          Orderings known to be wrong, each scoring 0. They exist to
          attach feedback to a mistake the author expects.
        items:
          "$ref": "#/$defs/Alternative"
        minItems: 1

      content:
        enum:
          - code
          - text
        description: >-
          How the lines are written and presented: `code` for a fenced
          code block, normally paired with `highlight`, and `text` for an
          unordered list. Inferred from the body when the frontmatter
          leaves it out.
        default: text

      highlight:
        type: string
        description: >-
          Programming language used for syntax highlighting. Only
          applicable when `content` is `code`; it is ignored (and the
          linter warns) otherwise.
        minLength: 1
        examples:
          - python
          - javascript

      indentation:
        enum:
          - fixed
          - lenient
          - strict
        default: fixed
        description: >-
          Whether the student may change a line's indentation, and
          whether it counts when grading. `fixed` presents the authored
          indentation and does not let the student change it; `lenient`
          lets them change it but ignores it when grading, which implies
          the `dedent` normalization; `strict` lets them change it and
          compares it.

      unmatched:
        enum:
          - manual
          - incorrect
        default: manual
        description: >-
          What becomes of a response that matches neither `lines` nor any
          entry of `accept` or `reject`. `manual` leaves it ungraded, for
          the instructor to score by hand, the way an essay is; `incorrect`
          scores it 0. A response that does match is graded automatically
          either way.

      normalizations:
        type: array
        description: >-
          Transformations applied to both sides of every comparison --
          the response and each answer key alike -- before they are
          matched. They never change what the student is shown.
        items:
          enum:
            - dedent
            - skip-blanks
        uniqueItems: true
        default: []

    required:
      - type
      - lines

# Rejects any key not defined by question-base.yaml or by the object
# schema above. Plain `additionalProperties: false` can't be used here
# because it only sees properties declared in its *own* schema object,
# not sibling schemas combined via `allOf` -- `unevaluatedProperties`,
# evaluated after the whole `allOf` is applied, is the composition-safe
# equivalent.
unevaluatedProperties: false

"$defs":
  Lines:
    type: array
    title: Lines
    description: A sequence of lines, in the order they are meant to be read.
    items:
      "$ref": "#/$defs/Line"
    minItems: 1

  Line:
    type: array
    title: Line
    description: >-
      One line, as an `[indentation level, text]` pair. The level is a
      count of indentation units, not of spaces -- the unit itself is
      inferred from the question, see
      docs/question-types/ordering.md#indentation. A response carries the
      same pair shape.
    prefixItems:
      - type: integer
        description: Indentation level, in indentation units.
        minimum: 0
      - type: string
        description: >-
          The text of the line, with its leading indentation removed.
    items: false
    minItems: 2
    maxItems: 2

  Alternative:
    type: object
    title: Alternative ordering
    description: >-
      One accepted or rejected ordering of the question's lines, with the
      feedback shown to the student whose response it matched.
    additionalProperties: false
    properties:
      lines:
        "$ref": "#/$defs/Lines"

      feedback:
        type: string
        description: >-
          Feedback text shown to the student whose response matched this
          ordering. An implementation MAY supply a generic message when
          it is absent.
        minLength: 1

      comment:
        type: string
        description: >-
          An author-facing note. Never shown to students.
        minLength: 1

    required:
      - lines
