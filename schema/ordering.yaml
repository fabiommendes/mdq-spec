"$schema": "https://json-schema.org/draft/2020-12/schema"
"$id": "https://raw.githubusercontent.com/fabiommendes/mdq-spec/main/schema/ordering.yaml"
title: Ordering question
description: >-
  A question where the student sorts a list of lines into the correct
  order. Extends the common question-base schema with the `lines` that
  form the answer key, the distractor lines mixed in with them, and the
  alternative orderings the question accepts or rejects outright.

allOf:
  - "$ref": "./question-base.yaml"
  - type: object
    properties:
      type:
        const: ordering

      lines:
        description: >-
          The lines to be ordered, in the main correct order (part of the
          answer key, with `accept`). Students are shown them shuffled,
          together with `extra`. The `lines` need at least one line after
          normalization (a model rule). The same line may appear more than once; each
          occurrence is a separate copy the student must place.
        "$ref": "#/$defs/Lines"
        minItems: 2

      extra:
        description: >-
          Distractor lines, shuffled in among `lines`. A distractor may
          repeat a line of `lines`, which hands the student another copy
          of a line they do need. A correct response is any response equal
          to a declared answer after normalization, whatever pool lines
          it uses.
        "$ref": "#/$defs/Lines"

      accept:
        type: array
        description: >-
          Alternative orderings that are also correct, each scoring 1 like
          `lines` itself. An alternative may leave lines out, but it may
          only use lines of `lines`, identified by line identity (see
          docs/question-types/ordering.md#line-identity), and no more
          copies of one than `lines` has (not a distractor from `extra`).
          It must have at least one line after normalization. Model
          rules, not expressed in this schema.
        items:
          "$ref": "#/$defs/Alternative"
        minItems: 1

      reject:
        type: array
        description: >-
          Orderings known to be wrong, each scoring 0. They attach
          feedback to a mistake the author expects, and under
          `unmatched: manual` they settle a matching response that would
          otherwise be pending. An alternative
          must not equal `lines` or an `accept` entry after normalization,
          and one that uses lines `lines` and `extra` do not offer can
          never match. An alternative that is empty after normalization is
          valid. Model rules, not expressed in this schema.
        items:
          "$ref": "#/$defs/Alternative"
        minItems: 1

      content:
        enum:
          - code
          - text
        description: >-
          How the lines are written and presented: `code` for a fenced
          code block, normally paired with `highlight`, and `text` for an
          unordered list. In Markdown the body implies it, so it is never
          written in the frontmatter; a YAML or JSON document MUST state it.

      highlight:
        type: string
        description: >-
          Programming language used for syntax highlighting. Only allowed
          when `content` is `code`. A code block with no language leaves
          it out.
        minLength: 1
        examples:
          - python
          - javascript

      indentation:
        enum:
          - fixed
          - lenient
          - strict
        default: fixed
        description: >-
          Whether the student may change a line's indentation, and
          whether it counts when grading. `fixed` presents the authored
          indentation and does not let the student change it; `lenient`
          lets them change it but ignores it when grading, which implies
          the `dedent` normalization; `strict` lets them change it and
          compares it. Under `lenient` and `strict` the lines are first
          shown at level 0.

      unmatched:
        enum:
          - manual
          - incorrect
        default: incorrect
        description: >-
          What becomes of a response that matches neither `lines` nor any
          entry of `accept` or `reject`. `incorrect` (the default) scores
          it 0; `manual` leaves it ungraded, for the instructor to score
          by hand, the way an essay is. A response that does match is
          graded automatically either way.

      incorrectFeedback:
        type: string
        description: >-
          Feedback for an incorrect response that no `reject` entry gave
          feedback to: a response that matches nothing under `unmatched:
          incorrect`, or one that matches a `reject` entry with no
          feedback. Block Markdown, like the feedback of an entry. Never
          shown for a pending response.

      normalizations:
        type: array
        uniqueItems: true
        description: >-
          Transformations applied to both sides of every comparison --
          the response and each declared answer alike -- before they are
          matched. They never change what the student is shown.
        items:
          "$ref": "#/$defs/Normalization"
        default: []

    required:
      - type
      - lines
      - content

    # `highlight` is allowed only for code content.
    if:
      required:
        - highlight
    then:
      properties:
        content:
          const: code

# Rejects any key not defined by question-base.yaml or by the object
# schema above. Plain `additionalProperties: false` can't be used here
# because it only sees properties declared in its *own* schema object,
# not sibling schemas combined via `allOf` -- `unevaluatedProperties`,
# evaluated after the whole `allOf` is applied, is the composition-safe
# equivalent.
unevaluatedProperties: false

"$defs":
  Normalization:
    title: Normalization
    description: A transformation applied before two lines are compared.
    enum:
      - dedent
      - skip-blanks

  Lines:
    type: array
    title: Lines
    description: A sequence of lines, in the order they are meant to be read.
    items:
      "$ref": "#/$defs/Line"
    minItems: 1

  Line:
    type: array
    title: Line
    description: >-
      One line, as an `[indentation level, text]` pair. The level is not
      a count of spaces: in a code block it counts indentation units
      (the unit is inferred from the question), and in a `ul` list it is
      the nesting depth of the item, see
      docs/question-types/ordering.md#indentation. A response carries the
      same pair shape.
    prefixItems:
      - type: integer
        description: >-
          Indentation level, in indentation units (code) or nesting
          depth (list).
        minimum: 0
      - type: string
        description: >-
          The text of the line. It has no leading or trailing space or
          tab and no line break. The text is empty only for a blank line
          of a code block.
        pattern: '^(?:[^ \t\r\n](?:[^\r\n]*[^ \t\r\n])?)?$'
    items: false
    minItems: 2
    maxItems: 2
    # A blank line has the level 0.
    if:
      minItems: 2
      prefixItems:
        - true
        - const: ""
    then:
      prefixItems:
        - const: 0

  Alternative:
    type: object
    title: Alternative ordering
    description: >-
      One accepted or rejected ordering of the question's lines, with the
      feedback shown to the student whose response it matched.
    additionalProperties: false
    properties:
      lines:
        "$ref": "#/$defs/Lines"

      feedback:
        type: string
        description: >-
          Feedback text shown to the student whose response matched this
          ordering. An implementation MAY supply a generic message when
          it is absent.

      comment:
        type: string
        description: >-
          An author-facing note. Never shown to students.

    required:
      - lines
