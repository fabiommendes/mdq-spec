[project]
name = "mdq-spec"
version = "0.1.0"
description = "Reference schemas and validation CLI for the MDQ question file format."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.18",
    "referencing>=0.28",
    "PyYAML>=6.0",
    "typer>=0.12",
    "pytest>=8.4.2",
    "rich>=15.0.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
mdq-spec = "mdq_spec.cli:main"

[tool.setuptools]
packages = ["mdq_spec"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mdq_spec"
module-root = "."

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-coverage>=0.0",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
test = "pytest tests"
cov = "pytest --cov=mdq_spec --cov-report=term-missing"
doc = "uv doc0 build"
doc-watch = "uv doc0 watch"
examples = "uv run mdq_spec examples"
