[project]
name = "mdq-spec"
version = "0.1.0"
description = "Reference schemas and validation CLI for the MDQ question file format."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "jsonschema>=4.18",
    "referencing>=0.28",
    "PyYAML>=6.0",
    "typer>=0.12",
    "pytest>=8.4.2",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
mdq_spec = "mdq_spec.cli:main"

[tool.setuptools]
packages = ["mdq_spec"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "taskipy>=1.14.1",
]
